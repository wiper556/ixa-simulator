<style>
  body{background:#ffffff;}

  .skl-search{margin-bottom:14px;}

  }
  .skl-search input:focus{outline:none;border-color:var(--gold);}

  .skl-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg-panel);}
  .skl-list-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;text-decoration:none;color:var(--paper);border-bottom:1px solid var(--line);
  }
  .skl-list-row:last-child{border-bottom:none;}
  .skl-list-row:hover{background:var(--bg-panel-2);}
  .skl-list-name{font-family:'Noto Serif JP',serif;font-weight:700;font-size:14px;}
  .skl-list-badge{font-size:10.5px;font-family:'JetBrains Mono',monospace;color:var(--muted);flex-shrink:0;}
  .skl-no-result{color:var(--muted);font-size:12px;padding:14px;text-align:center;}

  .skl-detail-title{font-family:'Noto Serif JP',serif;font-weight:900;font-size:22px;color:var(--paper);}
  .skl-detail-rank{font-size:13px;color:var(--vermillion-bright);font-weight:700;margin-left:8px;}
  .skl-detail-meta{font-size:13px;color:var(--muted);margin:6px 0 14px;}

  .skl-detail-block{margin-bottom:20px;}
  .skl-detail-block h2{font-family:'Noto Serif JP',serif;font-size:15px;margin:0 0 8px;color:var(--vermillion-bright);border-bottom:1px dashed var(--line);padding-bottom:6px;}
  .skl-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .skl-stat-table{width:100%;border-collapse:collapse;font-size:13px;}
  .skl-stat-table th,.skl-stat-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap;}
  .skl-stat-table th{background:var(--bg-panel-2);color:var(--muted);font-weight:700;}
  .skl-stat-table td[style*="text-align:left"]{white-space:normal;min-width:220px;}
  .skl-col-narrow{width:64px;}
  .skl-col-wrap{white-space:normal;max-width:130px;}
  .skl-effect-text{font-size:13.5px;line-height:1.8;}
  .skl-flag{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:6px;
    background:rgba(184,64,47,0.1);color:var(--vermillion-bright);border:1px solid var(--vermillion);
  }
  .skl-no-detail{color:var(--muted);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;}

  @media (max-width:600px){
    .skl-stat-table{font-size:12px;}
    .skl-stat-table th,.skl-stat-table td{padding:6px 8px;}
  }

  .sim-version-badge{

    border:1px solid var(--line); pointer-events:none; user-select:text;

  function sklEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function sklColorizeMujin(s){
    return sklEscapeHtml(s).replace(/無尽/g, '<span style="color:#00acc1;font-weight:700;">無尽</span>')
      .replace(/撤退/g, '<span style="color:#1565c0;font-weight:700;">撤退</span>');
  }

  // ============ 一覧表示 ============
  function sklRenderListRow(s){
    return '<a class="skl-list-row" href="#'+sklEscapeHtml(s.name)+'">'
      + '<span class="skl-list-name">'+sklEscapeHtml(s.name)+'</span>'
      + '<span class="skl-list-badge">'+sklEscapeHtml(s.rank)+'</span>'
      + '</a>';
  }

  function sklRenderList(list){
    const el = document.getElementById('sklList');
    if(list.length === 0){
      el.innerHTML = '<div class="skl-no-result">該当するスキルが見つかりません</div>';
      return;
    }
    el.innerHTML = list.map(sklRenderListRow).join('');
  }

  function sklDoSearch(){
    const q = document.getElementById('sklSearchBox').value.trim();
    const list = q === '' ? skills : skills.filter(function(s){ return s.name.includes(q); });
    sklRenderList(list);
  }

  document.getElementById('sklSearchBox').addEventListener('input', sklDoSearch);

  // ============ 詳細表示 ============
  function sklRenderDetail(s){
    const body = document.getElementById('sklDetailBody');
    const flags = [];
    if(s.noMimic) flags.push('模倣不可');
    if(s.noDuplicate) flags.push('部隊内重複不可');
    if(s.hasMujin) flags.push('無尽');

    body.innerHTML =
      '<h1 class="skl-detail-title">'+sklEscapeHtml(s.name)+'<span class="skl-detail-rank">'+sklEscapeHtml(s.rank)+'</span></h1>'
      + '<p class="skl-detail-meta">確率+'+s.baseRate+'% ／ 対象:'+sklEscapeHtml(s.target)+'</p>'
      + (flags.length ? flags.map(function(f){ return '<span class="skl-flag">'+sklEscapeHtml(f)+'</span>'; }).join('') : '')
      + '<div class="skl-detail-block">'
        + '<h2>効果概要</h2>'
        + '<div class="skl-effect-text">'+sklColorizeMujin(s.effectSummary || '')+'</div>'
        + (s.mujinNote ? '<div class="skl-effect-text" style="margin-top:6px;color:var(--muted);">'+sklColorizeMujin(s.mujinNote)+'</div>' : '')
        + (s.relatedNote ? '<div class="skl-effect-text" style="margin-top:6px;color:var(--muted);">'+sklColorizeMujin(s.relatedNote)+'</div>' : '')
        + (s.categoryLinks && s.categoryLinks.length ? s.categoryLinks.map(function(c){
            return '<div class="skl-effect-text" style="margin-top:8px;"><a href="'+c.href+'">→ '+sklEscapeHtml(c.label)+'</a></div>';
          }).join('') : '')
      + '</div>'
      + (s.trTable ? (
        '<div class="skl-detail-block"><h2>鍛錬レベル別性能</h2>'
        + '<div class="skl-table-scroll"><table class="skl-stat-table"><thead><tr><th>レベル</th><th class="skl-col-narrow">必要ポイント</th><th>効果</th></tr></thead><tbody>'
        + s.trTable.map(function(row){ return '<tr><td>'+sklEscapeHtml(row.level)+'</td><td class="skl-col-narrow">'+sklEscapeHtml(row.points||'-')+'</td><td style="text-align:left;">'+sklColorizeMujin(row.effect)+'</td></tr>'; }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (s.sourceCharacters && s.sourceCharacters.length ? (
        '<div class="skl-detail-block"><h2>入手可能な武将(合成素材)</h2>'
        + '<div class="skl-table-scroll"><table class="skl-stat-table"><thead><tr><th class="skl-col-wrap">武将</th><th class="skl-col-narrow">候補</th></tr></thead><tbody>'
        + s.sourceCharacters.map(function(row){
            return '<tr><td class="skl-col-wrap"><a href="characters.html#'+encodeURIComponent(row.no)+'">'+sklEscapeHtml(row.name)+' No.'+sklEscapeHtml(row.no)+'</a></td><td class="skl-col-narrow">'+sklEscapeHtml(row.slot)+'</td></tr>';
          }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (s.ownHiddenCandidate ? (
        '<div class="skl-detail-block"><h2>このスキルを習得済みのカードを合成素材にした場合の隠し候補</h2>'
        + '<div class="skl-effect-text">'+sklSkillRefLabel(s.ownHiddenCandidate.skill, s.ownHiddenCandidate.rank)+'</div>'
        + '</div>'
      ) : '');
  }

  // 汎用ヘルパー: スキル名を表示し、そのスキル自身のページがskills内にあればリンク化した上でLV10性能も併記する
  function sklSkillRefLabel(skillName, rank){
    const label = sklEscapeHtml(skillName)+(rank ? ' '+sklEscapeHtml(rank) : '');
    const target = skills.find(function(x){ return x.name === skillName; });
    if(!target){
      return label;
    }
    const nameHtml = '<a href="#'+encodeURIComponent(skillName)+'">'+label+'</a>';
    const lv10Row = (target.trTable || []).find(function(row){ return row.level === 'LV10'; });
    if(!lv10Row){
      return nameHtml;
    }
    return nameHtml + '<br>' + sklColorizeMujin(lv10Row.effect);
  }

  // ============ 表示切り替え(URLハッシュに応じて一覧/詳細を出し分け) ============
  function sklRoute(){
    const hash = decodeURIComponent(location.hash.replace('#',''));
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    if(!hash){
      listView.style.display = '';
      detailView.style.display = 'none';
      return;
    }
    const s = skills.find(function(x){ return x.name === hash; });
    if(!s){
      listView.style.display = '';
      detailView.style.display = 'none';
      return;
    }
    listView.style.display = 'none';
    detailView.style.display = '';
    sklRenderDetail(s);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', sklRoute);
  sklRenderList(skills);
  sklRoute();
</script>
