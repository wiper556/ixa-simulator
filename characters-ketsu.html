<script>

  // 傑は3種のみ。鍛錬(TR)が無く効果は固定、合成素材にもできないため、
  // trTable / synthesisTable / cost / rankGrades は持たせていない。
  // 数値と効果文はカード画像から直接読み取った(傑はカード上にNo.表示が無いため、
  // No.はくじの提供割合表(ゲーム内「確率情報」)に準拠している)。
  const ketsuGenerals = [
    {name:"織田信長", no:"20001", furigana:"おだのぶなが", illustrator:"直良有祐",
      troop:"全攻", sub:"", hasHado:true,
      effect:"鉄砲足軽の攻防+7／攻撃666%上昇(覇道)",
      imageFull:"assets/img/characters/no20001_full.png", imageChar:"assets/img/characters/no20001_char.png",
      atkBase:70000, defBase:50000, tacticsBase:5000, lv0Troops:25000,
      initialSkill:"天魔絶界",
      skillDetail:"傑/効果固定 確率 100% 攻撃666%上昇/対象:全　覇道\n模倣不可・重複不可\n①攻撃666%上昇する\n②所属部隊の「鉄砲足軽」の攻撃力・防御力が+7される\n③同じ合流攻撃に参加する他部隊の「鉄砲足軽」の攻撃力が+3される\n④所属部隊の武将が持つスキルを無効化や発動率低下から保護する",
      alwaysEffects:[
        "本領と陣、出城が黄金造りになる",
        "チャットの文字色が金色になる",
        "位階有効時、階位が正一位となる",
        "陣獲得時、陣のレベルが5になる"
      ]},

    {name:"豊臣秀吉", no:"20002", furigana:"とよとみひでよし", illustrator:"直良有祐",
      troop:"全攻防", sub:"", hasHado:true,
      effect:"騎馬鉄砲の攻防+7／攻防550%上昇／黄金造りの拠点で武将攻防1.5倍(覇道)",
      imageFull:"assets/img/characters/no20002_full.png", imageChar:"assets/img/characters/no20002_char.png",
      atkBase:60000, defBase:60000, tacticsBase:5500, lv0Troops:24000,
      initialSkill:"覇軍 悉国平定",
      skillDetail:"傑/効果固定 確率 100% 攻撃550%上昇/対象:全　覇道\n模倣不可・重複不可\n①攻撃550%上昇する\n②防御550%上昇する\n③所属部隊の「騎馬鉄砲」の攻撃力・防御力が+7される\n④同じ合流攻撃に参加する他部隊の「騎馬鉄砲」の攻撃力が+3される\n⑤【黄金造り】の拠点に配置時は武将攻撃力と武将防御力が1.5倍される\n⑥所属部隊の武将が持つスキルを無効化や発動率低下から保護する",
      alwaysEffects:[
        "本領と陣、出城が黄金造りになる",
        "チャットの文字色が金色になる",
        "位階有効時、階位が正一位となる",
        "陣獲得時、陣のレベルが5になる"
      ]},

    {name:"徳川家康", no:"20003", furigana:"とくがわいえやす", illustrator:"直良有祐",
      troop:"全攻防", sub:"飛翔10", hasHado:true,
      effect:"焙烙火矢の攻防+7／攻防500%上昇+飛翔10(覇道)",
      imageFull:"assets/img/characters/no20003_full.png", imageChar:"assets/img/characters/no20003_char.png",
      atkBase:65000, defBase:65000, tacticsBase:5000, lv0Troops:25000,
      initialSkill:"神威蓋世",
      skillDetail:"傑/効果固定 確率 100% 攻撃500%上昇/対象:全　覇道　飛翔10\n模倣不可・重複不可\n①攻撃500%上昇する\n②防御500%上昇する\n③飛翔10を得る\n④所属部隊の「焙烙火矢」の攻撃力・防御力が+7される\n⑤同じ合流攻撃に参加する他部隊の「焙烙火矢」の攻撃力が+3される\n⑥所属部隊の武将が持つスキルを無効化や発動率低下から保護する",
      alwaysEffects:[
        "合戦中1回まで「葵紋の陣」を作成できる(「葵紋の陣」は【傑】を含む部隊でしか攻撃できず陣破壊スキルに破壊されない／この武将が作成した「葵紋の陣」のみ距離4以内の同盟員の陣も「葵紋の陣」となる)",
        "本領と陣、出城が黄金造りになる",
        "チャットの文字色が金色になる",
        "位階有効時、階位が正一位となる",
        "陣獲得時、陣のレベルが5になる"
      ]}
  ];


  function ktEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // 無尽・撤退・飛翔・覇道などの語に色を付ける(極ページと同じ扱い)
  function ktColorize(s){
    return ktEscapeHtml(s)
      .replace(/飛翔\d*/g, function(m){ return '<span style="color:#f8b500;font-weight:700;">'+m+'</span>'; })
      .replace(/覇道/g, '<span style="color:#b8402f;font-weight:700;">覇道</span>')
      .replace(/卓越/g, '<span style="color:#2e7d32;font-weight:700;">卓越</span>')
      .replace(/\n/g, '<br>');
  }
  function ktAtkDefBadge(troop){
    const a = troop.includes('攻'), d = troop.includes('防');
    if(a && d) return {cls:'both', label:'攻防'};
    if(a) return {cls:'atk', label:'攻撃'};
    if(d) return {cls:'def', label:'防御'};
    return {cls:'other', label:'特殊'};
  }

  function ktRenderList(){
    const rows = ketsuGenerals.map(function(g){
      const ad = ktAtkDefBadge(g.troop);
      return '<tr onclick="location.hash=\'' + g.no + '\';" style="cursor:pointer;">'
        + '<td class="kt-col-card"><img src="'+g.imageChar+'" alt="'+ktEscapeHtml(g.name)+'のカード" loading="lazy" decoding="async"></td>'
        + '<td>'+g.no+'</td>'
        + '<td class="kt-col-name"><a href="#'+g.no+'">'+ktEscapeHtml(g.name)+'</a></td>'
        + '<td>'+ktEscapeHtml(g.initialSkill)+'</td>'
        + '<td><span class="kt-atkdef-badge '+ad.cls+'">'+ad.label+'</span></td>'
        + '<td>'+g.atkBase+'</td><td>'+g.defBase+'</td><td>'+g.tacticsBase+'</td><td>'+g.lv0Troops+'</td>'
        + '<td class="kt-col-effect">'+ktColorize(g.effect)+'</td>'
        + '</tr>';
    }).join('');
    document.getElementById('ktList').innerHTML =
      '<div class="kt-table-scroll"><table class="kt-list-table"><thead><tr>'
      + '<th>カード</th><th>No.</th><th>武将名</th><th>スキル</th><th>攻防</th>'
      + '<th>攻撃</th><th>防御</th><th>兵法</th><th>指揮兵数</th><th>スキル効果</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function ktRenderDetail(g){
    const body = document.getElementById('ktDetailBody');
    body.innerHTML =
      '<div class="kt-detail-head">'
        + '<img class="kt-detail-img" src="'+g.imageFull+'" alt="'+ktEscapeHtml(g.name)+'">'
        + '<div>'
          + '<h1 class="kt-detail-title">'+ktEscapeHtml(g.name)+'<span class="kt-detail-furigana">'+ktEscapeHtml(g.furigana)+'</span></h1>'
          + '<p class="kt-detail-meta">No.'+g.no+' ／ 指揮兵数'+g.lv0Troops+'</p>'
          + '<div class="kt-detail-block">'
            + '<h2>ステータス</h2>'
            + '<div class="kt-table-scroll"><table class="kt-stat-table">'
            + '<thead><tr><th>攻撃</th><th>防御</th><th>兵法</th></tr></thead>'
            + '<tbody><tr><td>'+g.atkBase+'</td><td>'+g.defBase+'</td><td>'+g.tacticsBase+'</td></tr></tbody>'
            + '</table></div>'
            + '<p class="kt-detail-meta" style="margin-top:6px;">傑は突破による成長やステータス振り分けが無いため、表示値がそのまま最終値になる。</p>'
          + '</div>'
        + '</div>'
      + '</div>'
      + '<div class="kt-detail-block">'
        + '<h2>スキル</h2>'
        + '<div class="kt-skill-name">'+ktEscapeHtml(g.initialSkill)+'</div>'
        + '<div class="kt-skill-detail">'+ktColorize(g.skillDetail)+'</div>'
      + '</div>'
      + '<div class="kt-detail-block">'
        + '<h2>常時効果(戦闘以外)</h2>'
        + '<ul class="kt-always">' + g.alwaysEffects.map(function(t){ return '<li>'+ktEscapeHtml(t)+'</li>'; }).join('') + '</ul>'
      + '</div>'
      + '<p class="kt-detail-meta">傑は鍛錬(TR)が無く効果は固定。合成素材にもできないため、鍛錬表と合成候補の欄は無い。</p>'
      + '<p class="kt-illust-credit">Illust. '+ktEscapeHtml(g.illustrator)+'</p>';
  }

  function ktRoute(){
    const hash = decodeURIComponent(location.hash.replace('#',''));
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    const g = hash ? ketsuGenerals.find(function(x){ return x.no === hash; }) : null;
    if(!g){
      listView.style.display = '';
      detailView.style.display = 'none';
      if(window.renderCommentsWidget) renderCommentsWidget('pageComments', 'page:characters-ketsu');
      return;
    }
    listView.style.display = 'none';
    detailView.style.display = '';
    ktRenderDetail(g);
    if(window.renderCommentsWidget) renderCommentsWidget('ktComments', 'charketsu:'+g.no);
    // PERMALINK:start この項目だけの単独ページ(検索から直接来られるようにしている)
    (function(){
      const box = document.getElementById('ktPermalink');
      if(box) box.innerHTML = '<a href="' + 'busho/'+g.no+'.html' + '">このページの単独URL</a>';
    })();
    // PERMALINK:end
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', ktRoute);
  ktRenderList();
  ktRoute();

  const KETSU_DB_VERSION = 'v2026-08-12.2';
  (function(){
    const badge = document.getElementById('simVersionBadge');
    if(badge) badge.textContent = KETSU_DB_VERSION;
  })();

</script>
</body>
