<script>

  // 傑は3種のみ。鍛錬(TR)が無く効果は固定、合成素材にもできないため、
  // trTable / synthesisTable / cost / rankGrades は持たせていない。
  // 数値と効果文はカード画像から直接読み取った(傑はカード上にNo.表示が無いため、
  // No.はくじの提供割合表(ゲーム内「確率情報」)に準拠している)。
  // BUILD:ketsuGenerals:start ここから下は tools/build_data.py が data/busho-ketsu/ から生成しています。直接編集しないこと
  const ketsuGenerals = [
    {name:"織田信長", no:"20001", furigana:"おだのぶなが", troop:"全攻", sub:"", effect:"鉄砲足軽の攻防+7／攻撃 666%上昇(覇道)",
      imageFull:"assets/img/characters/no20001_full.png", imageChar:"assets/img/characters/no20001_char.png",
      atkBase:70000, defBase:50000, tacticsBase:5000, lv0Troops:25000, initialSkill:"天魔絶界", ch:null},

    {name:"豊臣秀吉", no:"20002", furigana:"とよとみひでよし", troop:"全攻防", sub:"",
      effect:"騎馬鉄砲の攻防+7／攻防550%上昇／黄金造りの拠点で武将攻防1.5倍(覇道)", imageFull:"assets/img/characters/no20002_full.png",
      imageChar:"assets/img/characters/no20002_char.png", atkBase:60000, defBase:60000, tacticsBase:5500,
      lv0Troops:24000, initialSkill:"覇軍 悉国平定", ch:"24章"},

    {name:"徳川家康", no:"20003", furigana:"とくがわいえやす", troop:"全攻防", sub:"飛翔10", effect:"焙烙火矢の攻防+7／攻防500%上昇+飛翔10(覇道)",
      imageFull:"assets/img/characters/no20003_full.png", imageChar:"assets/img/characters/no20003_char.png",
      atkBase:65000, defBase:65000, tacticsBase:5000, lv0Troops:25000, initialSkill:"神威蓋世", ch:"25章"},

    {name:"武田信玄", no:"20004", furigana:"たけだしんげん", troop:"全攻防速", sub:"", effect:"赤備えの攻防+3／攻防770%上昇+速度350%上昇(覇道)",
      imageFull:null, imageChar:null, atkBase:55000, defBase:55000, tacticsBase:6000, lv0Troops:10000,
      initialSkill:"至天ノ御旗", ch:"26章"},

    {name:"足利義昭", no:"20005", furigana:"あしかがよしあき", troop:"全攻", sub:"不屈1",
      effect:"武士の攻撃+3／攻撃1200%上昇+不屈1(部隊内に不屈1付与・自軍発動率+15%・卓越+10%)(覇道)", imageFull:null, imageChar:null, atkBase:65000,
      defBase:0, tacticsBase:6000, lv0Troops:9000, initialSkill:"天網鎖陣", ch:"27章"},

    {name:"伊達政宗", no:"20006", furigana:"だてまさむね", troop:"全攻", sub:"撤退",
      effect:"騎馬鉄砲の攻撃+3／攻撃1400%上昇(覇道・撤退／HP回復・自軍卓越+15%)", imageFull:null, imageChar:null, atkBase:68000, defBase:0,
      tacticsBase:5500, lv0Troops:9500, initialSkill:"紫電ノ龍将", ch:"28章"},

    {name:"黒田如水", no:"20007", furigana:"くろだじょすい", troop:"全攻防", sub:"飛翔24 兵站",
      effect:"鉄砲足軽の攻撃+3／攻防3600%上昇+飛翔24(覇道・兵站／自軍発動率+10%・卓越+15%)", imageFull:null, imageChar:null, atkBase:64000,
      defBase:64000, tacticsBase:6200, lv0Troops:14000, initialSkill:"神智天鏡", ch:"29章"}
  ];
  // BUILD:ketsuGenerals:end


  function ktEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // 無尽・撤退・飛翔・覇道などの語に色を付ける(極ページと同じ扱い)
  function ktColorize(s){
    return ktEscapeHtml(s)
      .replace(/飛翔\d*/g, function(m){ return '<span style="color:#f8b500;font-weight:700;">'+m+'</span>'; })
      .replace(/覇道/g, '<span style="color:#b8402f;font-weight:700;">覇道</span>')
      .replace(/卓越/g, '<span style="color:#2e7d32;font-weight:700;">卓越</span>')
      .replace(/\n/g, '<br>');
  }
  function ktAtkDefBadge(troop){
    const a = troop.includes('攻'), d = troop.includes('防');
    if(a && d) return {cls:'both', label:'攻防'};
    if(a) return {cls:'atk', label:'攻撃'};
    if(d) return {cls:'def', label:'防御'};
    return {cls:'other', label:'特殊'};
  }

  function ktRenderList(){
    const rows = ketsuGenerals.map(function(g){
      const ad = ktAtkDefBadge(g.troop);
      // 2026-08-14: 天・極と同じく、行も武将名も個別ページ(busho/{No}.html)へ向ける
      const href = 'busho/'+g.no+'.html';
      return '<tr onclick="location.href=\'' + href + '\';" style="cursor:pointer;">'
        + '<td class="kt-col-card"><img src="'+g.imageChar+'" alt="'+ktEscapeHtml(g.name)+'のカード" loading="lazy" decoding="async"></td>'
        + '<td>'+g.no+'</td>'
        + '<td class="kt-col-name"><a href="'+href+'">'+ktEscapeHtml(g.name)+'</a></td>'
        + '<td>'+ktEscapeHtml(g.initialSkill)+'</td>'
        + '<td><span class="kt-atkdef-badge '+ad.cls+'">'+ad.label+'</span></td>'
        + '<td>'+g.atkBase+'</td><td>'+g.defBase+'</td><td>'+g.tacticsBase+'</td><td>'+g.lv0Troops+'</td>'
        + '<td class="kt-col-effect">'+ktColorize(g.effect)+'</td>'
        + '</tr>';
    }).join('');
    document.getElementById('ktList').innerHTML =
      '<div class="kt-table-scroll"><table class="kt-list-table"><thead><tr>'
      + '<th>カード</th><th>No.</th><th>武将名</th><th>スキル</th><th>攻防</th>'
      + '<th>攻撃</th><th>防御</th><th>兵法</th><th>指揮兵数</th><th>スキル効果</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function ktRenderDetail(g){
    const body = document.getElementById('ktDetailBody');
    body.innerHTML =
      '<div class="kt-detail-head">'
        + '<img class="kt-detail-img" src="'+g.imageFull+'" alt="'+ktEscapeHtml(g.name)+'">'
        + '<div>'
          + '<h1 class="kt-detail-title">'+ktEscapeHtml(g.name)+'<span class="kt-detail-furigana">'+ktEscapeHtml(g.furigana)+'</span></h1>'
          + '<p class="kt-detail-meta">No.'+g.no+' ／ 指揮兵数'+g.lv0Troops+'</p>'
          + '<div class="kt-detail-block">'
            + '<h2>ステータス</h2>'
            + '<div class="kt-table-scroll"><table class="kt-stat-table">'
            + '<thead><tr><th>攻撃</th><th>防御</th><th>兵法</th></tr></thead>'
            + '<tbody><tr><td>'+g.atkBase+'</td><td>'+g.defBase+'</td><td>'+g.tacticsBase+'</td></tr></tbody>'
            + '</table></div>'
            + '<p class="kt-detail-meta" style="margin-top:6px;">傑は突破による成長やステータス振り分けが無いため、表示値がそのまま最終値になる。</p>'
          + '</div>'
        + '</div>'
      + '</div>'
      + '<div class="kt-detail-block">'
        + '<h2>スキル</h2>'
        + '<div class="kt-skill-name">'+ktEscapeHtml(g.initialSkill)+'</div>'
        + '<div class="kt-skill-detail">'+ktColorize(g.skillDetail)+'</div>'
      + '</div>'
      + '<div class="kt-detail-block">'
        + '<h2>常時効果(戦闘以外)</h2>'
        + '<ul class="kt-always">' + g.alwaysEffects.map(function(t){ return '<li>'+ktEscapeHtml(t)+'</li>'; }).join('') + '</ul>'
      + '</div>'
      + '<p class="kt-detail-meta">傑は鍛錬(TR)が無く効果は固定。合成素材にもできないため、鍛錬表と合成候補の欄は無い。</p>'
      + '<p class="kt-illust-credit">Illust. '+ktEscapeHtml(g.illustrator)+'</p>';
  }

  // 2026-08-14: 詳細は busho/{No}.html に完全に分けた。このページは一覧だけを出す。
  // 古い #No で来た人は、ページ末尾の転送スクリプトが個別ページへ送る。
  //
  // **ktRenderDetail は消さないこと。** busho/{No}.html の中身は
  // tools/gen_detail_pages.py がこの関数を実機で動かして作っている。
  function ktRoute(){
    document.getElementById('listView').style.display = '';
    document.getElementById('detailView').style.display = 'none';
    if(window.renderCommentsWidget) renderCommentsWidget('pageComments', 'page:characters-ketsu');
  }

  ktRenderList();
  ktRoute();

  const KETSU_DB_VERSION = 'v2026-08-12.2';
  (function(){
    const badge = document.getElementById('simVersionBadge');
    if(badge) badge.textContent = KETSU_DB_VERSION;
  })();

</script>
<script>
  // 古い #No / #スキル名 形式で来た人を、個別URLへ送る(2026-08-14)。
  // 一覧からは個別ページへ直接飛ぶようになり、このページに詳細パネルは無い。
  // 転送しておかないと、外に出回っている古いリンクが「一覧が開くだけ」になる。
  (function(){
    function go(){
      var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!h) return;
      var name = h.replace(/[^0-9]/g, '');
      if (!name) return;
      location.replace('busho/' + name + '.html');
    }
    go();
    window.addEventListener('hashchange', go);
  })();
</script>
