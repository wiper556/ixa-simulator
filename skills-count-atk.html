  function scEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function scColorizeMujin(s){
    return scEscapeHtml(s).replace(/無尽\d*\.?\d*/g, function(m){ return '<span style="color:#00acc1;font-weight:700;">'+m+'</span>'; })
      .replace(/撤退\d*\.?\d*/g, function(m){ return '<span style="color:#1565c0;font-weight:700;">'+m+'</span>'; })
      .replace(/飛翔\d*\.?\d*/g, function(m){ return '<span style="color:#f8b500;font-weight:700;">'+m+'</span>'; })
      .replace(/覇道\d*\.?\d*/g, function(m){ return '<span style="color:#d15050;font-weight:700;">'+m+'</span>'; })
      .replace(/不屈\d*\.?\d*/g, function(m){ return '<span style="color:#8ED973;font-weight:700;">'+m+'</span>'; })
      .replace(/兵站/g, function(m){ return '<span style="color:#8e24aa;font-weight:700;">'+m+'</span>'; })
      .replace(/卓越/g, function(m){ return '<span style="color:#7CB342;font-weight:700;">'+m+'</span>'; });
  }

  function scFormatNum(n){
    return (Math.round(n*10)/10).toFixed(1);
  }

  // 列ソート状態。key:'lv10'|'trMax'|null(null=登録時の初期順を維持)、dir:1=昇順/-1=降順
  let scSortState = { key: null, dir: -1 };

  function scUpdateSortArrows(){
    ['lv10','trMax'].forEach(function(key){
      const th = document.getElementById(key === 'lv10' ? 'scLv10Header' : 'scTrMaxHeader');
      const arrow = th.querySelector('.sc-th-arrow');
      arrow.textContent = (scSortState.key === key) ? (scSortState.dir === 1 ? '▲' : '▼') : '';
    });
  }

  function scToggleSort(key){
    if(scSortState.key === key){
      scSortState.dir *= -1;
    } else {
      scSortState.key = key;
      scSortState.dir = -1; // 初回クリックは効果の高い順(降順)から
    }
    scRender(document.getElementById('scFilter').value);
  }

  function scRender(filterSoldier){
    const el = document.getElementById('scList');
    const filterCategory = filterSoldier ? SOLDIER_TO_CATEGORY[filterSoldier] : '';
    const count = Math.max(0, parseInt(document.getElementById('scCount').value, 10) || 0);

    document.querySelector('#scLv10Header .sc-th-label').textContent = 'LV10攻撃力('+count+'人時)';
    document.querySelector('#scTrMaxHeader .sc-th-label').textContent = 'TR最大時攻撃力('+count+'人時)';
    scUpdateSortArrows();

    const list = filterCategory
      ? countAtkSkills.filter(function(s){ return (s.targetCategories||[]).includes(filterCategory); })
      : countAtkSkills;
    if(list.length === 0){
      el.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);">該当するスキルが見つかりません</td></tr>';
      return;
    }
    // 表示中の人数での実数値を算出してからソート(係数だけでなく固定加算分も含めた実値で比較する)
    let rows = list.map(function(s){
      return { s: s, lv10Num: s.fixedBonus + count*s.lv10Coefficient, trMaxNum: s.fixedBonus + count*s.trMaxCoefficient };
    });
    if(scSortState.key === 'lv10'){
      rows.sort(function(a,b){ return (a.lv10Num - b.lv10Num) * scSortState.dir; });
    } else if(scSortState.key === 'trMax'){
      rows.sort(function(a,b){ return (a.trMaxNum - b.trMaxNum) * scSortState.dir; });
    }
    el.innerHTML = rows.map(function(row){
      const s = row.s;
      const sources = (s.sourceCharacters || []).map(function(c){
        const dbPage = c.db === 'kyoku' ? 'characters-kyoku.html' : 'characters.html';
        return '<a href="'+dbPage+'#'+encodeURIComponent(c.no)+'">'+scEscapeHtml(c.name)+'('+scEscapeHtml(c.slot)+')</a>';
      }).join('<br>') || '-';
      const lv10Value = scFormatNum(row.lv10Num);
      const trMaxValue = scFormatNum(row.trMaxNum);
      const fixedPrefix = s.fixedBonus ? (s.fixedBonus+'%+') : '';
      const keywordSuffix = s.keywordNote ? '('+s.keywordNote+')' : '';
      const lv10Detail = fixedPrefix+s.lv10Coefficient+'%×防御参加武将数('+count+'人)='+lv10Value+'%'+keywordSuffix;
      const trMaxDetail = fixedPrefix+s.trMaxCoefficient+'%×防御参加武将数('+count+'人)='+trMaxValue+'%('+s.trMaxLabel+')'+keywordSuffix;
      return '<tr><td><a href="'+s.skillPage+'">'+scEscapeHtml(s.name)+'</a></td><td>'+scEscapeHtml(s.baseRate||'-')+'</td><td>'+scEscapeHtml(s.target||'-')+'</td>'
        + '<td style="text-align:left;white-space:normal;min-width:220px;">'+scColorizeMujin(lv10Detail)+'</td>'
        + '<td style="text-align:left;white-space:normal;min-width:220px;">'+scColorizeMujin(trMaxDetail)+'</td>'
        + '<td style="white-space:normal;">'+sources+'</td></tr>';
    }).join('');
  }

  document.getElementById('scFilter').addEventListener('change', function(){
    scRender(document.getElementById('scFilter').value);
  });
  document.getElementById('scCount').addEventListener('input', function(){
    scRender(document.getElementById('scFilter').value);
  });
  document.getElementById('scLv10Header').addEventListener('click', function(){ scToggleSort('lv10'); });
  document.getElementById('scTrMaxHeader').addEventListener('click', function(){ scToggleSort('trMax'); });

  scRender('');
</script>
