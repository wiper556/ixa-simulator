name: ルール検査

# なぜ要るか(第2回レッドチーム E-3 / E-4 / E-22、および E-1 / E-2 の残り):
#
# ローカルの門番は全部「ローカルの設定で自分を無効化できる」という同じ形をしている。
#   ・`core.hooksPath` を別の場所へ向ければフック3つが全部死ぬ(検出役もフックなので一緒に死ぬ)
#   ・新しいクローンや worktree には、そもそもフックが1つも入っていない
#   ・`--no-verify` は commit と push の両方にある
# 検出する側と検出される側が同じ機械に乗っている限り、この形は消えない。
#
# GitHub 側で同じ検査を回せば、ローカルで何をしても push した内容は必ず一度は見られる。
# **これが E-3 / E-4 / E-22 をまとめて塞ぐ唯一の構造的な手。**
#
# 注意: これは push されて初めて働く。ローカルに置いただけでは何も起きない。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# ジョブを分けた理由(2026-09-02):
#
# 1本のジョブに全部並べていたので、マージの確認に11分かかっていた。
# 内訳は 門番の自己テスト319秒(48%) / 監査の自己テスト174秒(26%) /
# 生成物の照合127秒(19%) で、**ルールを実際に判定している部分は合計5秒**。
# 残りは「その検査が本当に鳴るか」を毎回ゼロから作り直している時間で、
# これは第3〜5回レッドチームで足したもの。減らすと元の穴が開くので**消さない**。
# 直列に並べていたことだけが無駄なので、並列にする。検査は1つも減っていない。
#
# **必須チェックの名前は `check` のまま変えない。** ジョブ名を変えると
# docs/branch-protection.json の contexts と実物の両方を直す必要があり、
# 片側だけ直すと保護が効かないまま緑になる(S-14と同じ形)。
# 代わりに `check` を集約ジョブとして残し、他が全部緑のときだけ緑にする。
#
# 集約ジョブは `if: always()` で必ず走らせ、needs の結果を自分で見る。
# needs が落ちると集約ジョブは既定では skipped になり、**必須チェックの
# skipped は成功として扱われることがある**。それでは保護が素通りする。
jobs:
  audit:
    name: 監査・ルール・錠前
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        # quickjs: audit_characters.py が JS配列を実際に評価して取り出すのに使う
        # playwright: check_js.py がページの構文を見るのに使う
        run: |
          python -m pip install --quiet quickjs playwright
          python -m playwright install --with-deps chromium

      - name: フックを導入する(新規クローンで install_hooks が動くかの確認も兼ねる)
        # クローン直後はフックが1つも入っていない(第2回 E-22)。
        # 監査はフックの導入状況もHIGHで見るので、ここで実際に入れる。
        # 「新しいクローンで手順どおりに導入できるか」を毎回確かめることにもなる。
        run: |
          python tools/install_hooks.py
          python tools/install_hooks.py --check

      - name: 監査(HIGHがベースラインより増えていないか)
        run: |
          python tools/audit_characters.py
          python - <<'PY'
          import io, json, sys
          def load(p):
              try:
                  return json.load(io.open(p, encoding="utf-8"))
              except Exception:
                  return []
          def k(x): return "%s|%s|%s" % (x["sev"], x["cat"], x["msg"])
          cur = load("tools/audit_out/findings.json")
          base = {k(x) for x in load("tools/audit_baseline.json")}
          new = [x for x in cur if x["sev"] == "HIGH" and k(x) not in base]
          print("HIGH %d件(新規%d) / 全%d件"
                % (sum(1 for x in cur if x["sev"] == "HIGH"), len(new), len(cur)))
          for x in new:
              print("  [%s] %s" % (x["cat"], x["msg"][:150]))
          sys.exit(1 if new else 0)
          PY

      - name: ルール索引と違反ログの整合
        # 2026-08-13: rules.py が印字するだけで終了コードを変えていなかったので、
        # このステップは常に緑の飾りだった(第3回 I-7b)。今は sys.exit する。
        run: python tools/rules.py

      - name: 錠前(チェック・ルール・違反ログ・母集団が減っていないか)
        run: python tools/lock.py

      - name: 赤丸(approved)がリモートより増えていないか
        # ローカルの pre-push は無効化できるので、ここでも見る(第3回 G-6)。
        run: |
          git fetch --quiet origin "+refs/heads/*:refs/remotes/origin/*" || true
          python - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "tools")
          from audit_characters import extract_array
          # 許可記録(tools/approvals.txt)の読み方は、ローカル門番と**同じ関数**を使う。
          # 2026-08-19: 8b69e213 が入口を precommit_check.py にだけ足し、ここが
          # 無条件 exit 1 のまま残っていた。ローカルは通るのに CI だけ止まり、
          # 抜け道は --no-verify か保護解除しかない状態になっていた(PR #43)。
          # 書き写すと同じ食い違いをまた作るので、import して1つに保つ。
          from precommit_check import approvals_of
          A = {"characters.html": "generals", "characters-kyoku.html": "kyokuGenerals",
               "characters-ketsu.html": "ketsuGenerals"}
          def marks(ref):
              out = set()
              for f, v in A.items():
                  if ref is None:
                      if not os.path.exists(f):
                          continue
                      src = f
                  else:
                      r = subprocess.run(["git", "show", "%s:%s" % (ref, f)],
                                         capture_output=True, text=True, encoding="utf-8")
                      if r.returncode:
                          continue
                      src = "/tmp/_%s" % f.replace("/", "_")
                      open(src, "w", encoding="utf-8").write(r.stdout)
                  for g in extract_array(src, v):
                      if g.get("approved"):
                          out.add("%s:%s" % (f, g.get("no")))
              return out
          base = os.environ.get("GITHUB_BASE_REF") or "origin/master"
          try:
              before = marks(base)
          except Exception as e:
              print("比較対象 %s を読めない(%s)。初回は素通りする。" % (base, e))
              sys.exit(0)
          now = marks(None)
          gained = sorted(now - before)
          print("赤丸: %d件(比較対象 %d件)" % (len(now), len(before)))
          # 記録のあるカードだけ通す(D-14の入口)。読むのは**検査対象のツリー**の
          # 記録なので、記録が同じ push に入っていなければここでも止まる。
          allowed = approvals_of(".")
          okd = [x for x in gained if x.rsplit(":", 1)[-1] in allowed]
          gained = [x for x in gained if x not in okd]
          for x in okd:
              no = x.rsplit(":", 1)[-1]
              print("[許可] 赤丸にした: %s  (%s に明言 / %s)"
                    % (x, allowed[no][0], allowed[no][1]))
          for x in gained:
              print("  + " + x)
          sys.exit(1 if gained else 0)
          PY

      - name: ページのJS構文
        run: python tools/check_js.py

      - name: フックの正本が揃っているか
        # クローン直後はフックが入っていないのが正常なので、
        # ここでは「正本のファイルが存在し、中身が期待どおりか」だけを見る。
        run: |
          for f in pre-commit pre-merge-commit pre-push; do
            test -f "tools/hooks/$f" || { echo "tools/hooks/$f が無い"; exit 1; }
            grep -q "precommit_check.py" "tools/hooks/$f" || {
              echo "tools/hooks/$f が門番を呼んでいない"; exit 1; }
          done
          echo "フックの正本3件を確認した"

      - name: ブランチ保護が外されていないか
        # P-2(第4回): gh api は許可済みなので保護を確認なしで外せた。
        # 外した痕跡はリポジトリに残らないので、期待値と実物を突き合わせる。
        # 権限が無くて読めないときは落とさない(その旨を出す)。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          want = json.load(open("docs/branch-protection.json", encoding="utf-8"))
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          r = subprocess.run(
              ["gh", "api", "repos/%s/branches/master/protection" % repo],
              capture_output=True, text=True)
          if r.returncode != 0:
              print("保護設定を読めない(権限不足の可能性)。ここでは落とさない。")
              print((r.stderr or "")[-300:])
              sys.exit(0)
          got = json.loads(r.stdout)
          def dig(d, *ks):
              for k in ks:
                  d = (d or {}).get(k)
              return d
          bad = []
          if dig(got, "enforce_admins", "enabled") != want["enforce_admins"]:
              bad.append("enforce_admins")
          if dig(got, "allow_force_pushes", "enabled") != want["allow_force_pushes"]:
              bad.append("allow_force_pushes")
          if dig(got, "allow_deletions", "enabled") != want["allow_deletions"]:
              bad.append("allow_deletions")
          rsc = got.get("required_status_checks") or {}
          if rsc.get("strict") != want["required_status_checks"]["strict"]:
              bad.append("required_status_checks.strict")
          if sorted(rsc.get("contexts") or []) != sorted(
                  want["required_status_checks"]["contexts"]):
              bad.append("required_status_checks.contexts")
          print("保護設定: %s" % json.dumps(
              {"enforce_admins": dig(got, "enforce_admins", "enabled"),
               "strict": rsc.get("strict"), "contexts": rsc.get("contexts")},
              ensure_ascii=False))
          if bad:
              print("[停止] docs/branch-protection.json と違う: " + ", ".join(bad))
          sys.exit(1 if bad else 0)
          PY

      - name: push された各コミットに、門番固有の停止条件を当てる
        # Z-3 / AA-7(第5回): W-13 / P-03 / 生成物の手編集 / ベースライン理由 は
        # precommit_check.py にしか実装が無く、CIはコミット自身を一度も見ていなかった。
        # フックは `git commit -n` や `git -c core.hooksPath=` で痕跡なく外せるので、
        # 「外されていても、ここで必ず1回は見られる」状態にする。
        run: |
          # 2026-08-13: 比較元が取れないとき「最初のコミット」に落としていたので、
          # **新しいブランチを push した1回目は必ず全履歴を検査していた**。
          # 過去に入っている153件が毎回引っかかり、その回は絶対に緑にならない。
          # (2回目以降の push では before が取れるので通る。だから気づきにくかった)
          # 比較元は master との分岐点にする。今回の push で増えた分だけを見る。
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/master "$GITHUB_SHA" 2>/dev/null || true)
            echo "比較元が取れないので master との分岐点から見る: $BASE"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            echo "分岐点も取れないので最初のコミットから見る"
          fi
          python tools/precommit_check.py --mode ci --range "$BASE..$GITHUB_SHA"

  generated:
    name: 公開ページとデータの一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        # quickjs: audit_characters.py が JS配列を実際に評価して取り出すのに使う
        # playwright: check_js.py がページの構文を見るのに使う
        run: |
          python -m pip install --quiet quickjs playwright
          python -m playwright install --with-deps chromium

      - name: フックを導入する(新規クローンで install_hooks が動くかの確認も兼ねる)
        # クローン直後はフックが1つも入っていない(第2回 E-22)。
        # 監査はフックの導入状況もHIGHで見るので、ここで実際に入れる。
        # 「新しいクローンで手順どおりに導入できるか」を毎回確かめることにもなる。
        run: |
          python tools/install_hooks.py
          python tools/install_hooks.py --check

      - name: 公開されるページがデータと一致しているか
        # 生成物を手で書き換えても、再生成を忘れても、これまで通っていた(第3回 I-9/I-10)。
        # 実際に再生成して比べる。約1分。
        run: python tools/check_generated.py

  selftest-audit:
    name: 監査の自己テスト
    runs-on: ubuntu-latest
    # ケース名をここに書き写さない(--shard が CASES/EVASIONS の並びで振り分ける)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        # quickjs: audit_characters.py が JS配列を実際に評価して取り出すのに使う
        # playwright: check_js.py がページの構文を見るのに使う
        run: |
          python -m pip install --quiet quickjs playwright
          python -m playwright install --with-deps chromium

      - name: フックを導入する(新規クローンで install_hooks が動くかの確認も兼ねる)
        # クローン直後はフックが1つも入っていない(第2回 E-22)。
        # 監査はフックの導入状況もHIGHで見るので、ここで実際に入れる。
        # 「新しいクローンで手順どおりに導入できるか」を毎回確かめることにもなる。
        run: |
          python tools/install_hooks.py
          python tools/install_hooks.py --check

      - name: 監査の自己テスト(チェックが本当に鳴るか)
        run: python tools/audit_selftest.py --shard=${{ matrix.shard }}/3

  selftest-gate:
    name: 門番の自己テスト
    runs-on: ubuntu-latest
    # ケースIDをここに書き写さない。--shard は CASES の並び順で振り分けるので、
    # ケースを足せば自動でどれかの組に入る(書き写すと足したのに走らない事故が起きる)。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        # quickjs: audit_characters.py が JS配列を実際に評価して取り出すのに使う
        # playwright: check_js.py がページの構文を見るのに使う
        run: |
          python -m pip install --quiet quickjs playwright
          python -m playwright install --with-deps chromium

      - name: フックを導入する(新規クローンで install_hooks が動くかの確認も兼ねる)
        # クローン直後はフックが1つも入っていない(第2回 E-22)。
        # 監査はフックの導入状況もHIGHで見るので、ここで実際に入れる。
        # 「新しいクローンで手順どおりに導入できるか」を毎回確かめることにもなる。
        run: |
          python tools/install_hooks.py
          python tools/install_hooks.py --check
      - name: 門番の自己テスト(precommit固有の停止条件が本当に止めるか)
        # precommit_check.py はCIでは実行されないので、そこにしか無い停止条件
        # (W-13 / P-03 / 生成物の手編集 / ベースライン理由 / 道具の未ステージ改変)は
        # 検査の外にあった(第4回 K-3 / M-4 / L-1)。
        run: python tools/gate_selftest.py --shard=${{ matrix.shard }}/4

  check:
    # **この名前がブランチ保護の必須チェック。** 変えない。
    name: check
    runs-on: ubuntu-latest
    needs: [audit, generated, selftest-audit, selftest-gate]
    if: always()
    steps:
      - name: すべての検査が緑か
        run: |
          R="${{ join(needs.*.result, ',') }}"
          echo "各ジョブの結果: $R"
          case "$R" in
            *failure*|*cancelled*|*skipped*)
              echo "[停止] 緑でない検査がある"; exit 1;;
          esac
          echo "全部 success"
