<style>
  body{background:#ffffff;}

  .ue-search{margin-bottom:14px;}
  .ue-search input{
    width:100%;font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;padding:11px 14px;

  .ue-list-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .ue-list-table th,.ue-list-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle;white-space:nowrap;}

  .ue-list-table td.ue-col-name{text-align:left;}
  .ue-list-table td.ue-col-name a{font-family:'Noto Serif JP',serif;font-weight:700;color:var(--paper);text-decoration:none;}
  .ue-list-table td.ue-col-name a:hover{color:var(--vermillion-bright);}
  .ue-list-table td.ue-col-effect{text-align:left;white-space:normal;min-width:260px;color:var(--muted);line-height:1.6;}

  .ue-atkdef-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px;white-space:nowrap;}

  .ue-atkdef-badge.def{background:rgba(46,125,50,0.12);color:#2e7d32;}

  .ue-atkdef-badge.other{background:rgba(107,114,128,0.12);color:var(--muted);}

  .ue-branch-badge{
    display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    font-size:10.5px;font-weight:700;border-radius:3px;background:var(--bg-panel-2);

  .ue-detail-head{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;}

    width:460px;max-width:100%;height:220px;border-radius:8px;border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;
  }
  .ue-detail-title{font-family:'Noto Serif JP',serif;font-weight:900;font-size:22px;color:var(--paper);}
  .ue-detail-furigana{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400;}
  .ue-detail-meta{font-size:13px;color:var(--muted);margin:6px 0 14px;}

  .ue-detail-block{margin-bottom:20px;}
  .ue-detail-block h2{font-family:'Noto Serif JP',serif;font-size:15px;margin:0 0 8px;color:var(--vermillion-bright);border-bottom:1px dashed var(--line);padding-bottom:6px;}
  .ue-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .ue-stat-table{width:100%;border-collapse:collapse;font-size:13px;}
  .ue-stat-table th,.ue-stat-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap;}
  .ue-stat-table th{background:var(--bg-panel-2);color:var(--muted);font-weight:700;}
  .ue-stat-table td[style*="text-align:left"]{white-space:normal;min-width:220px;}
  .ue-col-narrow{width:64px;}
  .ue-synth-cell{display:flex;align-items:center;gap:10px;text-align:left;}
  .ue-synth-cell .ue-synth-name{flex-shrink:0;}
  .ue-synth-desc{
    width:150px;height:32px;flex-shrink:0;
    font-size:11px;color:var(--muted);line-height:1.4;white-space:normal;text-align:left;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }

  @media (max-width:600px){
    .ue-stat-table{font-size:12px;}
    .ue-stat-table th,.ue-stat-table td{padding:6px 8px;}
  }
  .ue-skill-name{font-family:'Noto Serif JP',serif;font-weight:700;font-size:15px;color:var(--gold-bright);margin-bottom:6px;}
  .ue-skill-detail{font-size:13.5px;line-height:1.8;}
  .ue-illust-credit{font-size:12px;color:var(--muted);text-align:right;}
  .ue-no-detail{color:var(--muted);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;}

  .sim-version-badge{

    border:1px solid var(--line); pointer-events:none; user-select:text;

  /* 一覧の行にカーソルを置いたときの顔出し(TYPE2を7割の大きさで) */
  .cardhover-pop{

  @media (hover:none){ .cardhover-pop{ display:none !important; } }

<script>
  const KYOKU_DB_VERSION = 'v2026-08-12.3';
  document.addEventListener('DOMContentLoaded', ()=>{
    const badge = document.getElementById('simVersionBadge');
    if(badge) badge.textContent = KYOKU_DB_VERSION;
  });

  /* ============ 上武将データベース ============
     characters.html(天・覇武将データベース)と同じ構造・レンダリングロジックを流用し、
     「上」ランクの武将のみを別データベースとして分離管理する。
  ============================================ */
  // BUILD:ueGenerals:start ここから下は tools/build_data.py が data/busho-ue/ から生成しています。直接編集しないこと
  const ueGenerals = [
  ];
  // BUILD:ueGenerals:end

  const KK_RANK_LABELS = {yari:'槍', yumi:'弓', uma:'馬', ki:'器'};

  function ueEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 武将カード上の表記に合わせ、ゲーム内共通キーワードを強調する(characters.htmlと同じ配色)
  function ueColorizeMujin(s){
    return ueEscapeHtml(s).replace(/無尽\d*\.?\d*/g, function(m){ return '<span style="color:#00acc1;font-weight:700;">'+m+'</span>'; })
      .replace(/撤退\d*\.?\d*/g, function(m){ return '<span style="color:#1565c0;font-weight:700;">'+m+'</span>'; })
      .replace(/飛翔\d*\.?\d*/g, function(m){ return '<span style="color:#f8b500;font-weight:700;">'+m+'</span>'; })
      .replace(/覇道\d*\.?\d*/g, function(m){ return '<span style="color:#d15050;font-weight:700;">'+m+'</span>'; })
      .replace(/不屈\d*\.?\d*/g, function(m){ return '<span style="color:#8ED973;font-weight:700;">'+m+'</span>'; })
      .replace(/兵站/g, function(m){ return '<span style="color:#8e24aa;font-weight:700;">'+m+'</span>'; })
      .replace(/卓越/g, function(m){ return '<span style="color:#7CB342;font-weight:700;">'+m+'</span>'; })
      .replace(/\n/g, '<br>');
  }

  // スキルデータベース(skills.html)にページがあるスキル名の一覧。ここに載っているスキルはリンク化する。
  const UE_LINKED_SKILLS = [];

  function ueSkillLink(skillName, rank){
    // 2026-08-15: スキル名が未確認(null)の枠で String(null) がそのまま出て、
    // 合成表に「null」という文字が並んでいた(No.2595 織田信長（4）で発覚)。
    if(!skillName) return '<span style="color:var(--muted);">未確認</span>';
    const label = ueEscapeHtml(skillName)+' '+ueEscapeHtml(rank||'');
    if(UE_LINKED_SKILLS.includes(skillName)){
      return '<a href="skills.html#'+encodeURIComponent(skillName)+'">'+label+'</a>';
    }
    return label;
  }

  function ueHasDetail(g){
    return !!g.imageFull || !!g.atkBase || !!g.rankGrades;
  }

  // 一覧の●マーク(社内運用ルール、サイト上に凡例は出さない):
  // 画像未登録=無印、画像登録済みだが未確認=青、監視役(kanshi-yaku)が問題なしと判断=黄、
  // ユーザーが内容OKと確認済み=赤(最終確定)
  function ueDetailMark(g){
    if (!g.imageFull) return '';
    const color = g.approved ? 'var(--vermillion-bright)' : (g.reviewedOk ? '#f5c518' : '#1565c0');
    return ' <span style="color:'+color+';">●</span>';
  }

  // ============ 一覧表示 ============
  // troop文字列に含まれる兵科1文字(全/槍/弓/馬/砲/器/鉄/騎)を判定するための一覧。
  const KK_TROOP_BRANCH_CHARS = ['全','槍','弓','馬','砲','器','鉄','騎','焙'];

  // troop文字列(例:「砲器攻」「全防」)から攻撃/防御/攻防/特殊(その他)を判定する
  function ueAtkDefBadge(troop){
    if(!troop || troop === '-') return {cls:'other', label:'特殊'};
    const hasAtk = troop.includes('攻');
    const hasDef = troop.includes('防');
    if(hasAtk && hasDef) return {cls:'both', label:'攻防'};
    if(hasAtk) return {cls:'atk', label:'攻撃'};
    if(hasDef) return {cls:'def', label:'防御'};
    return {cls:'other', label:'特殊'};
  }

  function ueTroopBranchesHtml(troop){
    if(!troop || troop === '-') return '<span class="ue-branch-fallback">-</span>';
    const chars = troop.split('').filter(function(c){ return KK_TROOP_BRANCH_CHARS.includes(c); });
    if(chars.length === 0) return '<span class="ue-branch-fallback">'+ueEscapeHtml(troop)+'</span>';
    return chars.map(function(c){ return '<span class="ue-branch-badge">'+c+'</span>'; }).join('');
  }

  function ueRenderListRow(g){
    const atkDef = ueAtkDefBadge(g.troop);
    const subTagList = (g.sub || '').split(/\s+/).filter(Boolean);
    const subTags = subTagList.length
      ? subTagList.map(function(t){ return '<span class="ue-subtag">'+ueColorizeMujin(t)+'</span>'; }).join('')
      : '<span class="ue-branch-fallback">-</span>';
    const detailMark = ueDetailMark(g);
    var thumb = g.imageChar ? ' data-thumb="'+ueEscapeHtml(g.imageChar)+'"' : '';
    var href = 'busho/'+ueEscapeHtml(g.no)+'.html';
    return '<tr'+thumb+' onclick="location.href=\''+href+'\';" style="cursor:pointer;">'
      + '<td>'+ueEscapeHtml(g.no)+'</td>'
      + '<td class="ue-col-name"><a href="'+href+'">'+ueEscapeHtml(g.name)+'</a>'+detailMark+'</td>'
      + '<td>'+ueEscapeHtml(g.ch || '-')+'</td>'
      + '<td>'+(g.cost ?? '?')+'</td>'
      + '<td><span class="ue-atkdef-badge '+atkDef.cls+'">'+atkDef.label+'</span></td>'
      + '<td>'+ueTroopBranchesHtml(g.troop)+'</td>'
      + '<td>'+subTags+'</td>'
      + '<td class="ue-col-effect">'+ueColorizeMujin(g.effect || '-')+'</td>'
      + '</tr>';
  }

  function ueRenderList(list){
    const el = document.getElementById('ueList');
    if(list.length === 0){
      el.innerHTML = '<div class="ue-no-result">該当する武将が見つかりません</div>';
      return;
    }
    el.innerHTML = '<div class="ue-table-scroll"><table class="ue-list-table">'
      + '<thead><tr><th data-sort="no">No.</th><th data-sort="name">武将名</th><th data-sort="ch">入手章</th><th data-sort="cost">コスト</th><th data-sort="troop">攻防</th><th data-sort="troop">兵科</th><th data-sort="sub">特殊</th><th>スキル効果</th></tr></thead>'
      + '<tbody>' + list.map(ueRenderListRow).join('') + '</tbody>'
      + '</table></div>';
  }

  function ueChapterSortKey(ch){
    const m = String(ch || '').match(/^(\d+)章$/);
    return m ? parseInt(m[1], 10) : 9999;
  }

  function ueSortByChapterThenNo(list){
    return list.slice().sort(function(a, b){
      const chA = ueChapterSortKey(a.ch);
      const chB = ueChapterSortKey(b.ch);
      if (chA === 9999 && chB !== 9999) return 1;
      if (chB === 9999 && chA !== 9999) return -1;
      const chDiff = chB - chA;
      if (chDiff !== 0) return chDiff;
      return parseInt(a.no, 10) - parseInt(b.no, 10);
    });
  }


  /* ============ 列見出しでの並べ替え(2026-08-16 うぐさん指示) ============
     見出しを押すと 降順 → 昇順 → 既定 と回る。3回押せば元の並び
     (章の新しい順 → カードNo.)に戻る。
     並べ替えの鍵は「表に出ている値」に合わせる。攻防・兵科・特殊は
     セルの見た目そのものではなく元データの文字列で比べる。
  ============================================================ */
  var __SORT_STATE = { key: null, dir: 0 };   // dir: -1=降順 1=昇順 0=既定

  function __sortValue(g, key){
    if (key === 'no')   return parseInt(g.no, 10) || 0;
    if (key === 'cost') return (g.cost === null || g.cost === undefined)
                                ? -1 : parseFloat(g.cost);
    if (key === 'ch')   return -ueChapterSortKey(g.ch);      // 章は新しいほど大きく
    return (g[key] === null || g[key] === undefined) ? '' : String(g[key]);
  }

  function __applySort(list){
    if (!__SORT_STATE.key || __SORT_STATE.dir === 0) return ueSortByChapterThenNo(list);
    var k = __SORT_STATE.key, d = __SORT_STATE.dir;
    return list.slice().sort(function(a, b){
      var va = __sortValue(a, k), vb = __sortValue(b, k);
      if (typeof va === 'number' && typeof vb === 'number'){
        if (va !== vb) return (va - vb) * d;
      } else {
        var c = String(va).localeCompare(String(vb), 'ja');
        if (c !== 0) return c * d;
      }
      return (parseInt(a.no, 10) || 0) - (parseInt(b.no, 10) || 0);
    });
  }

  function __markHeaders(){
    var ths = document.querySelectorAll('.ue-list-table thead th');
    for (var i = 0; i < ths.length; i++){
      var key = ths[i].getAttribute('data-sort');
      if (!key) continue;
      var base = ths[i].getAttribute('data-label') || ths[i].textContent;
      ths[i].setAttribute('data-label', base);
      ths[i].textContent = base +
        (__SORT_STATE.key === key && __SORT_STATE.dir === -1 ? ' ▼'
         : __SORT_STATE.key === key && __SORT_STATE.dir === 1 ? ' ▲' : '');
    }
  }

  function __bindSort(){
    // **表は描画のたびに作り直されるので、th に直接付けない。**
    // document に1つだけ置いて、押された要素から th を辿る。
    document.addEventListener('click', function(ev){
      var th = ev.target.closest ? ev.target.closest('th[data-sort]') : null;
      if (!th || !th.closest('.ue-list-table')) return;
      var key = th.getAttribute('data-sort');
      if (__SORT_STATE.key !== key){ __SORT_STATE.key = key; __SORT_STATE.dir = -1; }
      else if (__SORT_STATE.dir === -1){ __SORT_STATE.dir = 1; }
      else { __SORT_STATE.key = null; __SORT_STATE.dir = 0; }
      ueDoSearch();
      __markHeaders();
    });
    __markHeaders();
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', __bindSort);
  else __bindSort();

  function ueDoSearch(){
    const q = document.getElementById('ueSearchBox').value.trim().toLowerCase();
    const list = __applySort(q === '' ? ueGenerals : ueGenerals.filter(function(g){
      return g.name.toLowerCase().includes(q)
        || g.no.includes(q)
        || (g.furigana || '').toLowerCase().includes(q)
        || (g.initialSkill || '').toLowerCase().includes(q);
    }));
    ueRenderList(list);
  }

  document.getElementById('ueSearchBox').addEventListener('input', ueDoSearch);

  // ============ 詳細表示 ============

  // 鍛錬表の行を絞る。LV10は常に出し、TR行は値が判明している一番上の段までを
  // 連続して出す(その範囲で値が無い段は「未確認」と表示する)。
  // 段を隠すと「LV10 → TR5」のように飛んで見え、TR1〜4が存在しないと誤解される。
  // 鍛錬表の「必要ポイント」。TR6が「パラレル」の武将は、パラレルカード
  // (番号+30000)を合成しないと上がらない。そのページがうちにあるならリンクにする。
  // **無い番号にはリンクしない**(TR6=パラレルは184体、登録済みのパラレルは12体だけ)。
  // どれが登録済みかは gen_detail_pages.py が window.__PARALLEL_NOS で渡す。
  function uePointsCell(points, no){
    const t = String(points == null ? '' : points);
    const esc = ueEscapeHtml(t || '-');
    if(t.indexOf('パラレル') < 0) return esc;
    const pno = String(Number(no) + 30000);
    const list = (typeof window !== 'undefined' && window.__PARALLEL_NOS) || [];
    if(list.indexOf(pno) < 0) return esc;
    return esc.replace('パラレル',
      '<a href="busho/' + pno + '.html">パラレル</a>');
  }

  function ueVisibleTrRows(rows){
    if(!rows || !rows.length) return [];
    const order = ['LV10','TR1','TR2','TR3','TR4','TR5','TR6'];
    const has = function(r){ return r.effect !== null && r.effect !== undefined && r.effect !== ''; };
    let top = -1;
    rows.forEach(function(r){
      if(r.level !== 'LV10' && has(r)){
        const i = order.indexOf(r.level);
        if(i > top) top = i;
      }
    });
    return rows.filter(function(r){
      if(r.level === 'LV10') return true;
      const i = order.indexOf(r.level);
      return i !== -1 && i <= top;
    });
  }

  function ueRenderDetail(g){
    const body = document.getElementById('ueDetailBody');
    if(!ueHasDetail(g)){
      body.innerHTML = '<h1 class="ue-detail-title">'+ueEscapeHtml(g.name)+'<span class="ue-detail-furigana">No.'+ueEscapeHtml(g.no)+'</span></h1>'
        + '<p class="ue-detail-meta">コスト'+(g.cost ?? '?')+' ／ '+ueEscapeHtml(g.troop || '-')+(g.sub ? ' ／ '+ueEscapeHtml(g.sub) : '')+'</p>'
        + '<div class="ue-no-detail">この武将の画像・ステータス・統率の詳細データはまだ登録されていません。<br>スキル概要: '+ueColorizeMujin(g.effect || '-')+'</div>';
      return;
    }
    const imgHtml = g.imageFull
      ? '<img class="ue-detail-img" src="'+g.imageFull+'" alt="'+ueEscapeHtml(g.name)+'">'
      : '<div class="ue-detail-img-placeholder">画像未登録</div>';
    const rankRow = g.rankGrades ? Object.keys(g.rankGrades).map(function(k){
        return '<td>'+(KK_RANK_LABELS[k]||k)+': '+ueEscapeHtml(g.rankGrades[k])+'</td>';
      }).join('') : '';

    body.innerHTML =
      '<div class="ue-detail-head">'
        + imgHtml
        + '<div>'
          + '<h1 class="ue-detail-title">'+ueEscapeHtml(g.name)+(g.furigana ? '<span class="ue-detail-furigana">'+ueEscapeHtml(g.furigana)+'</span>' : '')+'</h1>'
          + '<p class="ue-detail-meta">No.'+ueEscapeHtml(g.no)+' ／ コスト'+(g.cost ?? '?')+' ／ 指揮兵数'+(g.lv0Troops ?? '?')+'</p>'
          + '<div class="ue-detail-block">'
            + '<h2>ステータス</h2>'
            + '<div class="ue-table-scroll"><table class="ue-stat-table"><thead><tr><th>攻撃</th><th>防御</th><th>兵法</th></tr></thead>'
            + '<tbody><tr>'
              + '<td>'+g.atkBase+(g.atkGrowth?' (+'+g.atkGrowth+')':'')+'</td>'
              + '<td>'+g.defBase+(g.defGrowth?' (+'+g.defGrowth+')':'')+'</td>'
              + '<td>'+g.tacticsBase+(g.tacticsGrowth?' (+'+g.tacticsGrowth+')':'')+'</td>'
            + '</tr></tbody></table></div>'
          + '</div>'
          + (g.rankGrades ? (
            '<div class="ue-detail-block"><h2>統率</h2><div class="ue-table-scroll"><table class="ue-stat-table"><tbody><tr>'+rankRow+'</tr></tbody></table></div></div>'
          ) : '')
        + '</div>'
      + '</div>'
      + '<div class="ue-detail-block">'
        + '<h2>スキル</h2>'
        + '<div class="ue-skill-name">'+ueEscapeHtml(g.initialSkill || '-')+'</div>'
        + '<div class="ue-skill-detail">'+ueColorizeMujin(g.skillDetail || g.effect || '')+'</div>'
        + (g.mujinNote ? '<div class="ue-skill-detail" style="margin-top:6px;color:var(--muted);">'+ueColorizeMujin(g.mujinNote)+'</div>' : '')
        + (g.categoryLinks && g.categoryLinks.length ? g.categoryLinks.map(function(c){
            return '<div class="ue-skill-detail" style="margin-top:8px;"><a href="'+c.href+'">→ '+ueEscapeHtml(c.label)+'</a></div>';
          }).join('') : '')
      + '</div>'
      + (g.trTable ? (
        '<div class="ue-detail-block"><h2>鍛錬レベル別性能</h2>'
        + '<div class="ue-table-scroll"><table class="ue-stat-table"><thead><tr><th>レベル</th><th class="ue-col-narrow">必要ポイント</th><th>効果</th></tr></thead><tbody>'
        + ueVisibleTrRows(g.trTable).map(function(row){ return '<tr><td>'+ueEscapeHtml(row.level)+'</td><td class="ue-col-narrow">'+uePointsCell(row.points, g.no)+'</td><td style="text-align:left;">'+(row.effect ? ueColorizeMujin(row.effect) : '<span style="color:var(--muted);">未確認</span>')+'</td></tr>'; }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (g.synthesisTable ? (
        '<div class="ue-detail-block"><h2>合成素材にした場合の候補スキル</h2>'
        + '<div class="ue-table-scroll"><table class="ue-stat-table"><thead><tr><th>候補</th><th>初期スキル</th><th>移植後合成候補</th></tr></thead><tbody>'
        + g.synthesisTable.map(function(row){
            // 移植前(skill)と移植後(afterSkill)は別スキルのことがあり、性能も異なる。
            // target/rate/effectShort は移植前の性能、after* は移植後の性能を表す。
            // after* が未指定の場合は移植前の値をそのまま流用する(自己参照の行では同じ値になるため)。
            const buildDesc = function(t, r, e){
              const tl = t ? '対象:'+ueColorizeMujin(t)+' ' : '';
              const rl = r ? '確率'+ueEscapeHtml(r)+' ' : '';
              return (t || r || e) ? '<div class="ue-synth-desc">'+tl+rl+ueColorizeMujin(e||'')+'</div>' : '';
            };
            const desc = buildDesc(row.target, row.rate, row.effectShort);
            const hasAfterOwn = (row.afterTarget || row.afterRate || row.afterEffectShort);
            // 移植後が別スキルなのに専用の性能が未登録の場合、移植前の数値を流用すると誤情報になるため何も出さない
            const afterDesc = hasAfterOwn
              ? buildDesc(row.afterTarget || row.target, row.afterRate || row.rate, row.afterEffectShort || row.effectShort)
              : (row.afterSkill === row.skill ? desc : '');
            const skillLabel = '<div class="ue-synth-cell"><span class="ue-synth-name">'+ueSkillLink(row.skill, row.rank)+'</span>'+desc+'</div>';
            const afterLabel = row.afterSkill ? ('<div class="ue-synth-cell"><span class="ue-synth-name">'+ueSkillLink(row.afterSkill, row.afterRank)+'</span>'+afterDesc+'</div>') : '-';
            return '<tr><td>'+ueEscapeHtml(row.slot)+'</td><td>'+skillLabel+'</td>'
              + '<td>'+afterLabel+'</td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + (g.synthesisNote ? '<p class="ue-detail-meta" style="margin-top:6px;">'+ueEscapeHtml(g.synthesisNote)+'</p>' : '')
        + '</div>'
      ) : '')
      // 関連記事。articles を持つ武将だけに出る汎用フィールドで、
      // 見た目は記事一覧(blog.html)と同じ .article-card 系(site.css)をそのまま使う。
      + (g.articles && g.articles.length ? (
        '<div class="ue-detail-block"><h2>この武将を扱った記事</h2>'
        + '<ul class="article-list">'
        + g.articles.map(function(a){
            return '<li class="article-card"><a class="article-card-link" href="'+ueEscapeHtml(a.href)+'">'
              + '<div class="article-card-body">'
                + '<h2>'+ueEscapeHtml(a.title)+'</h2>'
                + (a.date ? '<div class="article-card-date">'+ueEscapeHtml(a.date)+'</div>' : '')
                + (a.excerpt ? '<p class="article-card-excerpt">'+ueEscapeHtml(a.excerpt)+'</p>' : '')
              + '</div>'
              + (a.thumb ? '<div class="article-card-thumb"><img src="'+ueEscapeHtml(a.thumb)+'" alt="" loading="lazy" decoding="async"></div>' : '')
              + '</a></li>';
          }).join('')
        + '</ul></div>'
      ) : '')
      + (g.illustrator ? '<p class="ue-illust-credit">Illust. '+ueEscapeHtml(g.illustrator)+'</p>' : '');
  }

  // ============ 表示切り替え(URLハッシュに応じて一覧/詳細を出し分け) ============
  // 2026-08-14: 詳細は busho/{No}.html に完全に分けた。このページは一覧だけを出す。
  // 古い #No で来た人は、ページ末尾の転送スクリプトが個別ページへ送る。
  //
  // **ueRenderDetail は消さないこと。** busho/{No}.html の中身は
  // tools/gen_detail_pages.py がこの関数を実機で動かして作っている。
  function ueRoute(){
    document.getElementById('listView').style.display = '';
    document.getElementById('detailView').style.display = 'none';
  }

  ueRenderList(ueSortByChapterThenNo(ueGenerals));
  ueRoute();
</script>
  </div>

<script>
  // 一覧の行にカーソルを置いたら TYPE2 の切り抜きを出す(2026-08-13、ユーザー依頼)。
  // 文字だけではどの武将か思い出せない、という話への対応。
  // 元画像は 224x315。その7割(157px幅)で出す。高さは比率のまま。
  (function(){
    // 触る画面では最初から何もしない。CSSでも display:none にしてあるが、
    // 「1回目のタップがホバー扱いになって、リンクを開くのに2回要る」という
    // 端末があるので、listener自体を付けないことで確実に避ける。
    try {
      if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
    } catch (e) {}
    var pop = null, img = null;
    function ensure(){
      if (pop) return;
      pop = document.createElement('div');
      pop.className = 'cardhover-pop';
      img = document.createElement('img');
      img.alt = '';
      pop.appendChild(img);
      document.body.appendChild(pop);
    }
    function place(ev){
      if (!pop || pop.style.display === 'none') return;
      var w = pop.offsetWidth || 165, h = pop.offsetHeight || 230, pad = 16;
      var x = ev.clientX + pad, y = ev.clientY + pad;
      if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
      if (y < 8) y = 8;
      pop.style.left = x + 'px';
      pop.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function(ev){
      var t = ev.target && ev.target.closest ? ev.target.closest('tr[data-thumb]') : null;
      if (!t) return;
      ensure();
      var src = t.getAttribute('data-thumb');
      if (img.getAttribute('src') !== src) img.setAttribute('src', src);
      pop.style.display = 'block';
      place(ev);
    });
    document.addEventListener('mousemove', place);
    document.addEventListener('mouseout', function(ev){
      if (!pop) return;
      var t = ev.target && ev.target.closest ? ev.target.closest('tr[data-thumb]') : null;
      var to = ev.relatedTarget && ev.relatedTarget.closest
        ? ev.relatedTarget.closest('tr[data-thumb]') : null;
      if (t && t !== to) pop.style.display = 'none';
    });
    // 画面が動いたら消す(位置がずれたまま残るのを防ぐ)
    window.addEventListener('scroll', function(){ if (pop) pop.style.display = 'none'; }, true);
  })();
</script>

<script>
  // 古い #No / #スキル名 形式で来た人を、個別URLへ送る(2026-08-14)。
  // 一覧からは個別ページへ直接飛ぶようになり、このページに詳細パネルは無い。
  // 転送しておかないと、外に出回っている古いリンクが「一覧が開くだけ」になる。
  (function(){
    function go(){
      var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!h) return;
      var name = h.replace(/[^0-9]/g, '');
      if (!name) return;
      location.replace('busho/' + name + '.html');
    }
    go();
    window.addEventListener('hashchange', go);
  })();
</script>
