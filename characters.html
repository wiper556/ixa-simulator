      atkBase:1220, atkGrowth:65, defBase:1220, defGrowth:65, tacticsBase:690.0, tacticsGrowth:3.5, lv0Troops:4790,
      rankGrades:{yari:'S', yumi:'A', uma:'A', ki:'S'},
      initialSkill:"仁侯ノ決断",
      skillDetail:"S/LV10 確率 100% 攻撃450%上昇/対象:全\n模倣不可\n①攻撃450%上昇する\n②防御450%上昇する\n③自軍全武将全スキルの卓越確率に15%を加算する(自軍内重複上限2)",
      trTable:[
        {level:"LV10", points:"-", effect:"全　確率 100% / 攻撃450%上昇+防御450%上昇(卓越確率+15%)"},
        {level:"TR1", points:"10", effect:"全　確率 100% / 攻撃490%上昇+防御490%上昇(卓越確率+17%)"},
        {level:"TR2", points:"40", effect:"全　確率 100% / 攻撃550%上昇+防御550%上昇(卓越確率+19%)"},
        {level:"TR3", points:"90", effect:"全　確率 100% / 攻撃620%上昇+防御620%上昇(卓越確率+21%)"},
        {level:"TR4", points:"150", effect:"全　確率 100% / 攻撃700%上昇+防御700%上昇(卓越確率+23%)"},
        {level:"TR5", points:"200", effect:"全　確率 100% / 攻撃790%上昇+防御790%上昇(卓越確率+25%)"}
      ]}
  ];

  const RANK_LABELS = {yari:'槍', yumi:'弓', uma:'馬', ki:'器'};

  function gdbEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 武将カード上の表記に合わせ、「無尽」を水色、「撤退」を濃い青で強調する
  function gdbColorizeMujin(s){
    return gdbEscapeHtml(s).replace(/無尽\d*\.?\d*/g, function(m){ return '<span style="color:#00acc1;font-weight:700;">'+m+'</span>'; })
      .replace(/撤退\d*\.?\d*/g, function(m){ return '<span style="color:#1565c0;font-weight:700;">'+m+'</span>'; })
      .replace(/飛翔\d*\.?\d*/g, function(m){ return '<span style="color:#f8b500;font-weight:700;">'+m+'</span>'; })
      .replace(/覇道\d*\.?\d*/g, function(m){ return '<span style="color:#d15050;font-weight:700;">'+m+'</span>'; })
      .replace(/不屈\d*\.?\d*/g, function(m){ return '<span style="color:#8ED973;font-weight:700;">'+m+'</span>'; })
      .replace(/兵站/g, function(m){ return '<span style="color:#8e24aa;font-weight:700;">'+m+'</span>'; })
      .replace(/卓越/g, function(m){ return '<span style="color:#7CB342;font-weight:700;">'+m+'</span>'; })
      .replace(/\n/g, '<br>');
  }

  // スキルデータベース(skills.html)にページがあるスキル名の一覧。ここに載っているスキルはリンク化する。
  const LINKED_SKILLS = ['勇冠三軍', '焼尽神無', '覆天征軍', '終焉焦土', '万物神勇', '経津主神ノ剣', '従魔絶神', '梵天浄界', '岳王ノ加護', '國才連豪', '虎賁統帥', '天地超克', '神羅聖域', '信明義星', '千里必勝ノ神算', '刹那無影', '月煌侵蝕', '虚実兵妙', '仙境解脱', '幻像鏡花', '開闢ノ逆鉾', '思金神ノ深謀', '戦華雄渾', '月詠ノ覇威', '絶無灰尽', '八幡神ノ威光', '龍驤虎躍', '永世ノ天隻', '黄泉醜女ノ屍兵', '高津姫神', '義陣絶刀', '破国八陣', '轟渦ノ神将', '王花尖剣', '泰厳射手', '国呑ノ蟒蛇', '虚空ノ導', '龍気剣鳴', '雄武英略', '坂西都督', '摩利支天ノ法', '不制于天地人', '神機采配', '十束ノ神域', '天聖宝冠', '四天轟雷', '火之迦具土神', '天香山命', '天津甕星ノ雷', '布都御魂ノ鬨', '天宇受売命', '万鬼闘帝', '三全将帥', '布刀玉ノ策', '火槍猛進'];

  function gdbSkillLink(skillName, rank){
    const label = gdbEscapeHtml(skillName)+' '+gdbEscapeHtml(rank||'');
    if(LINKED_SKILLS.includes(skillName)){
      return '<a href="skills.html#'+encodeURIComponent(skillName)+'">'+label+'</a>';
    }
    return label;
  }

  function gdbHasDetail(g){
    return !!g.imageFull || !!g.atkBase || !!g.rankGrades;
  }

  // 一覧の●マーク(社内運用ルール、サイト上に凡例は出さない):
  // 画像未登録=無印、画像登録済みだが未確認=青、監視役(kanshi-yaku)が問題なしと判断=黄、
  // ユーザーが内容OKと確認済み=赤(最終確定)
  function gdbDetailMark(g){
    if (!g.imageFull) return '';
    const color = g.approved ? 'var(--vermillion-bright)' : (g.reviewedOk ? '#f5c518' : '#1565c0');
    return ' <span style="color:'+color+';">●</span>';
  }

  // ============ 一覧表示 ============
  // troop文字列に含まれる兵科1文字(全/槍/弓/馬/砲/器/鉄/騎)を判定するための一覧。
  // ここに無い記号(「赤備え」等の固有兵種名や「-」)は分解できないため、そのままテキスト表示にフォールバックする。
  const TROOP_BRANCH_CHARS = ['全','槍','弓','馬','砲','器','鉄','騎','焙'];

  // troop文字列(例:「砲器攻」「全防」)から攻撃/防御/攻防/特殊(その他)を判定する
  function gdbAtkDefBadge(troop){
    if(!troop || troop === '-') return {cls:'other', label:'特殊'};
    const hasAtk = troop.includes('攻');
    const hasDef = troop.includes('防');
    if(hasAtk && hasDef) return {cls:'both', label:'攻防'};
    if(hasAtk) return {cls:'atk', label:'攻撃'};
    if(hasDef) return {cls:'def', label:'防御'};
    return {cls:'other', label:'特殊'};
  }

  function gdbTroopBranchesHtml(troop){
    if(!troop || troop === '-') return '<span class="gdb-branch-fallback">-</span>';
    const chars = troop.split('').filter(function(c){ return TROOP_BRANCH_CHARS.includes(c); });
    if(chars.length === 0) return '<span class="gdb-branch-fallback">'+gdbEscapeHtml(troop)+'</span>';
    return chars.map(function(c){ return '<span class="gdb-branch-badge">'+c+'</span>'; }).join('');
  }

  function gdbRenderListRow(g){
    const atkDef = gdbAtkDefBadge(g.troop);
    const subTagList = (g.sub || '').split(/\s+/).filter(Boolean);
    const subTags = subTagList.length
      ? subTagList.map(function(t){ return '<span class="gdb-subtag">'+gdbColorizeMujin(t)+'</span>'; }).join('')
      : '<span class="gdb-branch-fallback">-</span>';
    const detailMark = gdbDetailMark(g);
    return '<tr onclick="location.hash=\''+gdbEscapeHtml(g.no)+'\';" style="cursor:pointer;">'
      + '<td>'+gdbEscapeHtml(g.no)+'</td>'
      + '<td class="gdb-col-name"><a href="#'+gdbEscapeHtml(g.no)+'">'+gdbEscapeHtml(g.name)+'</a>'+detailMark+'</td>'
      + '<td>'+gdbEscapeHtml(g.ch || '-')+'</td>'
      + '<td>'+(g.cost ?? '?')+'</td>'
      + '<td><span class="gdb-atkdef-badge '+atkDef.cls+'">'+atkDef.label+'</span></td>'
      + '<td>'+gdbTroopBranchesHtml(g.troop)+'</td>'
      + '<td>'+subTags+'</td>'
      + '<td class="gdb-col-effect">'+gdbColorizeMujin(g.effect || '-')+'</td>'
      + '</tr>';
  }

  function gdbRenderList(list){
    const el = document.getElementById('gdbList');
    if(list.length === 0){
      el.innerHTML = '<div class="gdb-no-result">該当する武将が見つかりません(データベースは31〜32章の天・覇 約50名のみ収録)</div>';
      return;
    }
    el.innerHTML = '<div class="gdb-table-scroll"><table class="gdb-list-table">'
      + '<colgroup><col class="gdb-col-no"><col class="gdb-col-nameW"><col class="gdb-col-ch"><col class="gdb-col-cost"><col class="gdb-col-atkdef"><col class="gdb-col-troop"><col class="gdb-col-sub"><col class="gdb-col-effectW"></colgroup>'
      + '<thead><tr><th>No.</th><th>武将名</th><th>入手章</th><th>コスト</th><th>攻防</th><th>兵科</th><th>特殊</th><th>スキル効果</th></tr></thead>'
      + '<tbody>' + list.map(gdbRenderListRow).join('') + '</tbody>'
      + '</table></div>';
  }

  function gdbChapterSortKey(ch){
    const m = String(ch || '').match(/^(\d+)章$/);
    return m ? parseInt(m[1], 10) : 9999;
  }

  function gdbSortByChapterThenNo(list){
    return list.slice().sort(function(a, b){
      const chA = gdbChapterSortKey(a.ch);
      const chB = gdbChapterSortKey(b.ch);
      // Non-numeric chapters (裏/期間限定 etc, sort key 9999) always sink to the bottom.
      if (chA === 9999 && chB !== 9999) return 1;
      if (chB === 9999 && chA !== 9999) return -1;
      const chDiff = chB - chA; // newer (higher) chapter number first
      if (chDiff !== 0) return chDiff;
      return parseInt(a.no, 10) - parseInt(b.no, 10);
    });
  }

  function gdbDoSearch(){
    const q = document.getElementById('gdbSearchBox').value.trim();
    const list = gdbSortByChapterThenNo(q === '' ? generals : generals.filter(function(g){ return g.name.includes(q) || g.no.includes(q); }));
    gdbRenderList(list);
  }

  document.getElementById('gdbSearchBox').addEventListener('input', gdbDoSearch);

  // ============ 詳細表示 ============
  function gdbRenderDetail(g){
    const body = document.getElementById('gdbDetailBody');
    if(!gdbHasDetail(g)){
      body.innerHTML = '<h1 class="gdb-detail-title">'+gdbEscapeHtml(g.name)+'<span class="gdb-detail-furigana">No.'+gdbEscapeHtml(g.no)+'</span></h1>'
        + '<p class="gdb-detail-meta">コスト'+(g.cost ?? '?')+' ／ '+gdbEscapeHtml(g.troop || '-')+(g.sub ? ' ／ '+gdbEscapeHtml(g.sub) : '')+'</p>'
        + '<div class="gdb-no-detail">この武将の画像・ステータス・統率の詳細データはまだ登録されていません。<br>スキル概要: '+gdbColorizeMujin(g.effect || '-')+'</div>';
      return;
    }
    const imgHtml = g.imageFull
      ? '<img class="gdb-detail-img" src="'+g.imageFull+'" alt="'+gdbEscapeHtml(g.name)+'">'
      : '<div class="gdb-detail-img-placeholder">画像未登録</div>';
    const rankRow = g.rankGrades ? Object.keys(g.rankGrades).map(function(k){
        return '<td>'+(RANK_LABELS[k]||k)+': '+gdbEscapeHtml(g.rankGrades[k])+'</td>';
      }).join('') : '';

    body.innerHTML =
      '<div class="gdb-detail-head">'
        + imgHtml
        + '<div>'
          + '<h1 class="gdb-detail-title">'+gdbEscapeHtml(g.name)+(g.furigana ? '<span class="gdb-detail-furigana">'+gdbEscapeHtml(g.furigana)+'</span>' : '')+'</h1>'
          + '<p class="gdb-detail-meta">No.'+gdbEscapeHtml(g.no)+' ／ コスト'+(g.cost ?? '?')+' ／ 指揮兵数'+(g.lv0Troops ?? '?')+'</p>'
          + '<div class="gdb-detail-block">'
            + '<h2>ステータス</h2>'
            + '<div class="gdb-table-scroll"><table class="gdb-stat-table"><thead><tr><th>攻撃</th><th>防御</th><th>兵法</th></tr></thead>'
            + '<tbody><tr>'
              + '<td>'+g.atkBase+(g.atkGrowth?' (+'+g.atkGrowth+')':'')+'</td>'
              + '<td>'+g.defBase+(g.defGrowth?' (+'+g.defGrowth+')':'')+'</td>'
              + '<td>'+g.tacticsBase+(g.tacticsGrowth?' (+'+g.tacticsGrowth+')':'')+'</td>'
            + '</tr></tbody></table></div>'
          + '</div>'
          + (g.rankGrades ? (
            '<div class="gdb-detail-block"><h2>統率</h2><div class="gdb-table-scroll"><table class="gdb-stat-table"><tbody><tr>'+rankRow+'</tr></tbody></table></div></div>'
          ) : '')
        + '</div>'
      + '</div>'
      + '<div class="gdb-detail-block">'
        + '<h2>スキル</h2>'
        + '<div class="gdb-skill-name">'+gdbEscapeHtml(g.initialSkill || '-')+'</div>'
        + '<div class="gdb-skill-detail">'+gdbColorizeMujin(g.skillDetail || g.effect || '')+'</div>'
        + (g.mujinNote ? '<div class="gdb-skill-detail" style="margin-top:6px;color:var(--muted);">'+gdbColorizeMujin(g.mujinNote)+'</div>' : '')
        + (g.categoryLinks && g.categoryLinks.length ? g.categoryLinks.map(function(c){
            return '<div class="gdb-skill-detail" style="margin-top:8px;"><a href="'+c.href+'">→ '+gdbEscapeHtml(c.label)+'</a></div>';
          }).join('') : '')
      + '</div>'
      + (g.trTable ? (
        '<div class="gdb-detail-block"><h2>鍛錬レベル別性能</h2>'
        + '<div class="gdb-table-scroll"><table class="gdb-stat-table"><thead><tr><th>レベル</th><th class="gdb-col-narrow">必要ポイント</th><th>効果</th></tr></thead><tbody>'
        + g.trTable.map(function(row){ return '<tr><td>'+gdbEscapeHtml(row.level)+'</td><td class="gdb-col-narrow">'+gdbEscapeHtml(row.points||'-')+'</td><td style="text-align:left;">'+gdbColorizeMujin(row.effect)+'</td></tr>'; }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (g.mimicRarityTable ? (
        '<div class="gdb-detail-block"><h2>'+gdbEscapeHtml(g.mimicRarityTable.title||'模倣スキルのレアリティ係数と倍率')+'</h2>'
        + '<div class="gdb-table-scroll"><table class="gdb-stat-table"><thead><tr><th>レアリティ</th><th class="gdb-col-narrow">係数</th><th class="gdb-col-narrow">倍率</th>'
        + g.mimicRarityTable.levels.map(function(lv){ return '<th class="gdb-col-narrow">'+gdbEscapeHtml(lv)+'</th>'; }).join('')
        + '</tr></thead><tbody>'
        + g.mimicRarityTable.rows.map(function(row){
            return '<tr><td>'+gdbEscapeHtml(row.rarity)+'</td><td class="gdb-col-narrow">'+gdbEscapeHtml(row.coef)+'</td><td class="gdb-col-narrow">'+gdbEscapeHtml(row.multiplier)+'</td>'
              + row.values.map(function(v){ return '<td class="gdb-col-narrow">'+gdbEscapeHtml(v)+'</td>'; }).join('')
              + '</tr>';
          }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (g.synthesisTable ? (
        '<div class="gdb-detail-block"><h2>合成素材にした場合の候補スキル</h2>'
        + '<div class="gdb-table-scroll"><table class="gdb-stat-table"><thead><tr><th>候補</th><th>初期スキル</th><th>移植後合成候補</th></tr></thead><tbody>'
        + g.synthesisTable.map(function(row){
            const targetLabel = row.target ? '対象:'+gdbColorizeMujin(row.target)+' ' : '';
            const desc = row.rate ? '<div class="gdb-synth-desc">'+targetLabel+'確率'+gdbEscapeHtml(row.rate)+' '+gdbColorizeMujin(row.effectShort||'')+'</div>' : '';
            const skillLabel = '<div class="gdb-synth-cell"><span class="gdb-synth-name">'+gdbSkillLink(row.skill, row.rank)+'</span>'+desc+'</div>';
            const afterLabel = row.afterSkill ? ('<div class="gdb-synth-cell"><span class="gdb-synth-name">'+gdbSkillLink(row.afterSkill, row.afterRank)+'</span>'+desc+'</div>') : '-';
            return '<tr><td>'+gdbEscapeHtml(row.slot)+'</td><td>'+skillLabel+'</td>'
              + '<td>'+afterLabel+'</td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + (g.synthesisNote ? '<p class="gdb-detail-meta" style="margin-top:6px;">'+gdbEscapeHtml(g.synthesisNote)+'</p>' : '')
        + '</div>'
      ) : '')
      + (g.illustrator ? '<p class="gdb-illust-credit">Illust. '+gdbEscapeHtml(g.illustrator)+'</p>' : '');
  }

  // ============ 表示切り替え(URLハッシュに応じて一覧/詳細を出し分け) ============
  function gdbRoute(){
    const hash = decodeURIComponent(location.hash.replace('#',''));
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    if(!hash){
      listView.style.display = '';
      detailView.style.display = 'none';
      return;
    }
    const g = generals.find(function(x){ return x.no === hash; });
    if(!g){
      listView.style.display = '';
      detailView.style.display = 'none';
      return;
    }
    listView.style.display = 'none';
    detailView.style.display = '';
    gdbRenderDetail(g);
    if(window.renderCommentsWidget) renderCommentsWidget('gdbComments', 'char:'+g.no);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', gdbRoute);
  gdbRenderList(gdbSortByChapterThenNo(generals));
  gdbRoute();
</script>
  </div>
</div>
