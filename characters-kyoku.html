  const KK_RANK_LABELS = {yari:'槍', yumi:'弓', uma:'馬', ki:'器'};

  function kkEscapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 武将カード上の表記に合わせ、ゲーム内共通キーワードを強調する(characters.htmlと同じ配色)
  function kkColorizeMujin(s){
    return kkEscapeHtml(s).replace(/無尽\d*\.?\d*/g, function(m){ return '<span style="color:#00acc1;font-weight:700;">'+m+'</span>'; })
      .replace(/撤退\d*\.?\d*/g, function(m){ return '<span style="color:#1565c0;font-weight:700;">'+m+'</span>'; })
      .replace(/飛翔\d*\.?\d*/g, function(m){ return '<span style="color:#f8b500;font-weight:700;">'+m+'</span>'; })
      .replace(/覇道\d*\.?\d*/g, function(m){ return '<span style="color:#d15050;font-weight:700;">'+m+'</span>'; })
      .replace(/不屈\d*\.?\d*/g, function(m){ return '<span style="color:#8ED973;font-weight:700;">'+m+'</span>'; })
      .replace(/兵站/g, function(m){ return '<span style="color:#8e24aa;font-weight:700;">'+m+'</span>'; })
      .replace(/卓越/g, function(m){ return '<span style="color:#7CB342;font-weight:700;">'+m+'</span>'; })
      .replace(/\n/g, '<br>');
  }

  // スキルデータベース(skills.html)にページがあるスキル名の一覧。ここに載っているスキルはリンク化する。
  const KK_LINKED_SKILLS = [];

  function kkSkillLink(skillName, rank){
    const label = kkEscapeHtml(skillName)+' '+kkEscapeHtml(rank||'');
    if(KK_LINKED_SKILLS.includes(skillName)){
      return '<a href="skills.html#'+encodeURIComponent(skillName)+'">'+label+'</a>';
    }
    return label;
  }

  function kkHasDetail(g){
    return !!g.imageFull || !!g.atkBase || !!g.rankGrades;
  }

  // 一覧の●マーク(社内運用ルール、サイト上に凡例は出さない):
  // 画像未登録=無印、画像登録済みだが未確認=青、監視役(kanshi-yaku)が問題なしと判断=黄、
  // ユーザーが内容OKと確認済み=赤(最終確定)
  function kkDetailMark(g){
    if (!g.imageFull) return '';
    const color = g.approved ? 'var(--vermillion-bright)' : (g.reviewedOk ? '#f5c518' : '#1565c0');
    return ' <span style="color:'+color+';">●</span>';
  }

  // ============ 一覧表示 ============
  // troop文字列に含まれる兵科1文字(全/槍/弓/馬/砲/器/鉄/騎)を判定するための一覧。
  const KK_TROOP_BRANCH_CHARS = ['全','槍','弓','馬','砲','器','鉄','騎','焙'];

  // troop文字列(例:「砲器攻」「全防」)から攻撃/防御/攻防/特殊(その他)を判定する
  function kkAtkDefBadge(troop){
    if(!troop || troop === '-') return {cls:'other', label:'特殊'};
    const hasAtk = troop.includes('攻');
    const hasDef = troop.includes('防');
    if(hasAtk && hasDef) return {cls:'both', label:'攻防'};
    if(hasAtk) return {cls:'atk', label:'攻撃'};
    if(hasDef) return {cls:'def', label:'防御'};
    return {cls:'other', label:'特殊'};
  }

  function kkTroopBranchesHtml(troop){
    if(!troop || troop === '-') return '<span class="kk-branch-fallback">-</span>';
    const chars = troop.split('').filter(function(c){ return KK_TROOP_BRANCH_CHARS.includes(c); });
    if(chars.length === 0) return '<span class="kk-branch-fallback">'+kkEscapeHtml(troop)+'</span>';
    return chars.map(function(c){ return '<span class="kk-branch-badge">'+c+'</span>'; }).join('');
  }

  function kkRenderListRow(g){
    const atkDef = kkAtkDefBadge(g.troop);
    const subTagList = (g.sub || '').split(/\s+/).filter(Boolean);
    const subTags = subTagList.length
      ? subTagList.map(function(t){ return '<span class="kk-subtag">'+kkColorizeMujin(t)+'</span>'; }).join('')
      : '<span class="kk-branch-fallback">-</span>';
    const detailMark = kkDetailMark(g);
    return '<tr onclick="location.hash=\''+kkEscapeHtml(g.no)+'\';" style="cursor:pointer;">'
      + '<td>'+kkEscapeHtml(g.no)+'</td>'
      + '<td class="kk-col-name"><a href="#'+kkEscapeHtml(g.no)+'">'+kkEscapeHtml(g.name)+'</a>'+detailMark+'</td>'
      + '<td>'+kkEscapeHtml(g.ch || '-')+'</td>'
      + '<td>'+(g.cost ?? '?')+'</td>'
      + '<td><span class="kk-atkdef-badge '+atkDef.cls+'">'+atkDef.label+'</span></td>'
      + '<td>'+kkTroopBranchesHtml(g.troop)+'</td>'
      + '<td>'+subTags+'</td>'
      + '<td class="kk-col-effect">'+kkColorizeMujin(g.effect || '-')+'</td>'
      + '</tr>';
  }

  function kkRenderList(list){
    const el = document.getElementById('kkList');
    if(list.length === 0){
      el.innerHTML = '<div class="kk-no-result">該当する武将が見つかりません</div>';
      return;
    }
    el.innerHTML = '<div class="kk-table-scroll"><table class="kk-list-table">'
      + '<thead><tr><th>No.</th><th>武将名</th><th>入手章</th><th>コスト</th><th>攻防</th><th>兵科</th><th>特殊</th><th>スキル効果</th></tr></thead>'
      + '<tbody>' + list.map(kkRenderListRow).join('') + '</tbody>'
      + '</table></div>';
  }

  function kkChapterSortKey(ch){
    const m = String(ch || '').match(/^(\d+)章$/);
    return m ? parseInt(m[1], 10) : 9999;
  }

  function kkSortByChapterThenNo(list){
    return list.slice().sort(function(a, b){
      const chA = kkChapterSortKey(a.ch);
      const chB = kkChapterSortKey(b.ch);
      if (chA === 9999 && chB !== 9999) return 1;
      if (chB === 9999 && chA !== 9999) return -1;
      const chDiff = chB - chA;
      if (chDiff !== 0) return chDiff;
      return parseInt(a.no, 10) - parseInt(b.no, 10);
    });
  }

  function kkDoSearch(){
    const q = document.getElementById('kkSearchBox').value.trim();
    const list = kkSortByChapterThenNo(q === '' ? kyokuGenerals : kyokuGenerals.filter(function(g){ return g.name.includes(q) || g.no.includes(q); }));
    kkRenderList(list);
  }

  document.getElementById('kkSearchBox').addEventListener('input', kkDoSearch);

  // ============ 詳細表示 ============
  function kkRenderDetail(g){
    const body = document.getElementById('kkDetailBody');
    if(!kkHasDetail(g)){
      body.innerHTML = '<h1 class="kk-detail-title">'+kkEscapeHtml(g.name)+'<span class="kk-detail-furigana">No.'+kkEscapeHtml(g.no)+'</span></h1>'
        + '<p class="kk-detail-meta">コスト'+(g.cost ?? '?')+' ／ '+kkEscapeHtml(g.troop || '-')+(g.sub ? ' ／ '+kkEscapeHtml(g.sub) : '')+'</p>'
        + '<div class="kk-no-detail">この武将の画像・ステータス・統率の詳細データはまだ登録されていません。<br>スキル概要: '+kkColorizeMujin(g.effect || '-')+'</div>';
      return;
    }
    const imgHtml = g.imageFull
      ? '<img class="kk-detail-img" src="'+g.imageFull+'" alt="'+kkEscapeHtml(g.name)+'">'
      : '<div class="kk-detail-img-placeholder">画像未登録</div>';
    const rankRow = g.rankGrades ? Object.keys(g.rankGrades).map(function(k){
        return '<td>'+(KK_RANK_LABELS[k]||k)+': '+kkEscapeHtml(g.rankGrades[k])+'</td>';
      }).join('') : '';

    body.innerHTML =
      '<div class="kk-detail-head">'
        + imgHtml
        + '<div>'
          + '<h1 class="kk-detail-title">'+kkEscapeHtml(g.name)+(g.furigana ? '<span class="kk-detail-furigana">'+kkEscapeHtml(g.furigana)+'</span>' : '')+'</h1>'
          + '<p class="kk-detail-meta">No.'+kkEscapeHtml(g.no)+' ／ コスト'+(g.cost ?? '?')+' ／ 指揮兵数'+(g.lv0Troops ?? '?')+'</p>'
          + '<div class="kk-detail-block">'
            + '<h2>ステータス</h2>'
            + '<div class="kk-table-scroll"><table class="kk-stat-table"><thead><tr><th>攻撃</th><th>防御</th><th>兵法</th></tr></thead>'
            + '<tbody><tr>'
              + '<td>'+g.atkBase+(g.atkGrowth?' (+'+g.atkGrowth+')':'')+'</td>'
              + '<td>'+g.defBase+(g.defGrowth?' (+'+g.defGrowth+')':'')+'</td>'
              + '<td>'+g.tacticsBase+(g.tacticsGrowth?' (+'+g.tacticsGrowth+')':'')+'</td>'
            + '</tr></tbody></table></div>'
          + '</div>'
          + (g.rankGrades ? (
            '<div class="kk-detail-block"><h2>統率</h2><div class="kk-table-scroll"><table class="kk-stat-table"><tbody><tr>'+rankRow+'</tr></tbody></table></div></div>'
          ) : '')
        + '</div>'
      + '</div>'
      + '<div class="kk-detail-block">'
        + '<h2>スキル</h2>'
        + '<div class="kk-skill-name">'+kkEscapeHtml(g.initialSkill || '-')+'</div>'
        + '<div class="kk-skill-detail">'+kkColorizeMujin(g.skillDetail || g.effect || '')+'</div>'
        + (g.mujinNote ? '<div class="kk-skill-detail" style="margin-top:6px;color:var(--muted);">'+kkColorizeMujin(g.mujinNote)+'</div>' : '')
      + '</div>'
      + (g.trTable ? (
        '<div class="kk-detail-block"><h2>鍛錬レベル別性能</h2>'
        + '<div class="kk-table-scroll"><table class="kk-stat-table"><thead><tr><th>レベル</th><th class="kk-col-narrow">必要ポイント</th><th>効果</th></tr></thead><tbody>'
        + g.trTable.map(function(row){ return '<tr><td>'+kkEscapeHtml(row.level)+'</td><td class="kk-col-narrow">'+kkEscapeHtml(row.points||'-')+'</td><td style="text-align:left;">'+kkColorizeMujin(row.effect)+'</td></tr>'; }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (g.synthesisTable ? (
        '<div class="kk-detail-block"><h2>合成素材にした場合の候補スキル</h2>'
        + '<div class="kk-table-scroll"><table class="kk-stat-table"><thead><tr><th>候補</th><th>初期スキル</th><th>移植後合成候補</th></tr></thead><tbody>'
        + g.synthesisTable.map(function(row){
            const targetLabel = row.target ? '対象:'+kkColorizeMujin(row.target)+' ' : '';
            const desc = row.rate ? '<div class="kk-synth-desc">'+targetLabel+'確率'+kkEscapeHtml(row.rate)+' '+kkColorizeMujin(row.effectShort||'')+'</div>' : '';
            const skillLabel = '<div class="kk-synth-cell"><span class="kk-synth-name">'+kkSkillLink(row.skill, row.rank)+'</span>'+desc+'</div>';
            const afterLabel = row.afterSkill ? ('<div class="kk-synth-cell"><span class="kk-synth-name">'+kkSkillLink(row.afterSkill, row.afterRank)+'</span>'+desc+'</div>') : '-';
            return '<tr><td>'+kkEscapeHtml(row.slot)+'</td><td>'+skillLabel+'</td>'
              + '<td>'+afterLabel+'</td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + (g.synthesisNote ? '<p class="kk-detail-meta" style="margin-top:6px;">'+kkEscapeHtml(g.synthesisNote)+'</p>' : '')
        + '</div>'
      ) : '')
      + (g.illustrator ? '<p class="kk-illust-credit">Illust. '+kkEscapeHtml(g.illustrator)+'</p>' : '');
  }

  // ============ 表示切り替え(URLハッシュに応じて一覧/詳細を出し分け) ============
  function kkRoute(){
    const hash = decodeURIComponent(location.hash.replace('#',''));
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    if(!hash){
      listView.style.display = '';
      detailView.style.display = 'none';
      return;
    }
    const g = kyokuGenerals.find(function(x){ return x.no === hash; });
    if(!g){
      listView.style.display = '';
      detailView.style.display = 'none';
      return;
    }
    listView.style.display = 'none';
    detailView.style.display = '';
    kkRenderDetail(g);
    if(window.renderCommentsWidget) renderCommentsWidget('kkComments', 'charkyoku:'+g.no);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', kkRoute);
  kkRenderList(kkSortByChapterThenNo(kyokuGenerals));
  kkRoute();
</script>
  </div>
</div>

<script src="assets/js/site-sidebar.js"></script>
</body>
