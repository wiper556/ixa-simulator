  // ============ 一覧表示 ============
  // troop文字列に含まれる兵科1文字(全/槍/弓/馬/砲/器/鉄/騎)を判定するための一覧。
  const KK_TROOP_BRANCH_CHARS = ['全','槍','弓','馬','砲','器','鉄','騎','焙'];

  // troop文字列(例:「砲器攻」「全防」)から攻撃/防御/攻防/特殊(その他)を判定する
  function tkAtkDefBadge(troop){
    if(!troop || troop === '-') return {cls:'other', label:'特殊'};
    const hasAtk = troop.includes('攻');
    const hasDef = troop.includes('防');
    if(hasAtk && hasDef) return {cls:'both', label:'攻防'};
    if(hasAtk) return {cls:'atk', label:'攻撃'};
    if(hasDef) return {cls:'def', label:'防御'};
    return {cls:'other', label:'特殊'};
  }

  function tkTroopBranchesHtml(troop){
    if(!troop || troop === '-') return '<span class="tk-branch-fallback">-</span>';
    const chars = troop.split('').filter(function(c){ return KK_TROOP_BRANCH_CHARS.includes(c); });
    if(chars.length === 0) return '<span class="tk-branch-fallback">'+tkEscapeHtml(troop)+'</span>';
    return chars.map(function(c){ return '<span class="tk-branch-badge">'+c+'</span>'; }).join('');
  }

  function tkChapterSortKey(ch){
    const m = String(ch || '').match(/^(\d+)章$/);
    return m ? parseInt(m[1], 10) : 9999;
  }

  function tkSortByChapterThenNo(list){
    return list.slice().sort(function(a, b){
      const chA = tkChapterSortKey(a.ch);
      const chB = tkChapterSortKey(b.ch);
      if (chA === 9999 && chB !== 9999) return 1;
      if (chB === 9999 && chA !== 9999) return -1;
      const chDiff = chB - chA;
      if (chDiff !== 0) return chDiff;
      return parseInt(a.no, 10) - parseInt(b.no, 10);
    });
  }


  /* ============ 列見出しでの並べ替え(2026-08-16 うぐさん指示) ============
     見出しを押すと 降順 → 昇順 → 既定 と回る。3回押せば元の並び
     (章の新しい順 → カードNo.)に戻る。
     並べ替えの鍵は「表に出ている値」に合わせる。攻防・兵科・特殊は
     セルの見た目そのものではなく元データの文字列で比べる。
  ============================================================ */
  var __SORT_STATE = { key: null, dir: 0 };   // dir: -1=降順 1=昇順 0=既定

  function __sortValue(g, key){
    if (key === 'no')   return parseInt(g.no, 10) || 0;
    if (key === 'cost') return (g.cost === null || g.cost === undefined)
                                ? -1 : parseFloat(g.cost);
    if (key === 'ch')   return -tkChapterSortKey(g.ch);      // 章は新しいほど大きく
    return (g[key] === null || g[key] === undefined) ? '' : String(g[key]);
  }

  function __applySort(list){
    if (!__SORT_STATE.key || __SORT_STATE.dir === 0) return tkSortByChapterThenNo(list);
    var k = __SORT_STATE.key, d = __SORT_STATE.dir;
    return list.slice().sort(function(a, b){
      var va = __sortValue(a, k), vb = __sortValue(b, k);
      if (typeof va === 'number' && typeof vb === 'number'){
        if (va !== vb) return (va - vb) * d;
      } else {
        var c = String(va).localeCompare(String(vb), 'ja');
        if (c !== 0) return c * d;
      }
      return (parseInt(a.no, 10) || 0) - (parseInt(b.no, 10) || 0);
    });
  }

  function __markHeaders(){
    var ths = document.querySelectorAll('.tk-list-table thead th');
    for (var i = 0; i < ths.length; i++){
      var key = ths[i].getAttribute('data-sort');
      if (!key) continue;
      var base = ths[i].getAttribute('data-label') || ths[i].textContent;
      ths[i].setAttribute('data-label', base);
      ths[i].textContent = base +
        (__SORT_STATE.key === key && __SORT_STATE.dir === -1 ? ' ▼'
         : __SORT_STATE.key === key && __SORT_STATE.dir === 1 ? ' ▲' : '');
    }
  }

  function __bindSort(){
    // **表は描画のたびに作り直されるので、th に直接付けない。**
    // document に1つだけ置いて、押された要素から th を辿る。
    document.addEventListener('click', function(ev){
      var th = ev.target.closest ? ev.target.closest('th[data-sort]') : null;
      if (!th || !th.closest('.tk-list-table')) return;
      var key = th.getAttribute('data-sort');
      if (__SORT_STATE.key !== key){ __SORT_STATE.key = key; __SORT_STATE.dir = -1; }
      else if (__SORT_STATE.dir === -1){ __SORT_STATE.dir = 1; }
      else { __SORT_STATE.key = null; __SORT_STATE.dir = 0; }
      tkDoSearch();
      __markHeaders();
    });
    __markHeaders();
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', __bindSort);
  else __bindSort();

  function tkDoSearch(){
    const q = document.getElementById('tkSearchBox').value.trim().toLowerCase();
    const list = __applySort(q === '' ? tokuGenerals : tokuGenerals.filter(function(g){
      return g.name.toLowerCase().includes(q)
        || g.no.includes(q)
        || (g.furigana || '').toLowerCase().includes(q)
        || (g.initialSkill || '').toLowerCase().includes(q);
    }));
    tkRenderList(list);
  }

  document.getElementById('tkSearchBox').addEventListener('input', tkDoSearch);

  // ============ 詳細表示 ============

  // 鍛錬表の行を絞る。LV10は常に出し、TR行は値が判明している一番上の段までを
  // 連続して出す(その範囲で値が無い段は「未確認」と表示する)。
  // 段を隠すと「LV10 → TR5」のように飛んで見え、TR1〜4が存在しないと誤解される。
  function tkVisibleTrRows(rows){
    if(!rows || !rows.length) return [];
    const order = ['LV10','TR1','TR2','TR3','TR4','TR5','TR6'];
    const has = function(r){ return r.effect !== null && r.effect !== undefined && r.effect !== ''; };
    let top = -1;
    rows.forEach(function(r){
      if(r.level !== 'LV10' && has(r)){
        const i = order.indexOf(r.level);
        if(i > top) top = i;
      }
    });
    return rows.filter(function(r){
      if(r.level === 'LV10') return true;
      const i = order.indexOf(r.level);
      return i !== -1 && i <= top;
    });
  }

            + '<div class="tk-table-scroll"><table class="tk-stat-table"><thead><tr><th>攻撃</th><th>防御</th><th>兵法</th></tr></thead>'
            + '<tbody><tr>'
              + '<td>'+g.atkBase+(g.atkGrowth?' (+'+g.atkGrowth+')':'')+'</td>'
              + '<td>'+g.defBase+(g.defGrowth?' (+'+g.defGrowth+')':'')+'</td>'
              + '<td>'+g.tacticsBase+(g.tacticsGrowth?' (+'+g.tacticsGrowth+')':'')+'</td>'
            + '</tr></tbody></table></div>'
          + '</div>'
          + (g.rankGrades ? (
            '<div class="tk-detail-block"><h2>統率</h2><div class="tk-table-scroll"><table class="tk-stat-table"><tbody><tr>'+rankRow+'</tr></tbody></table></div></div>'
          ) : '')
        + '</div>'
      + '</div>'
      + '<div class="tk-detail-block">'
        + '<h2>スキル</h2>'
        + '<div class="tk-skill-name">'+tkEscapeHtml(g.initialSkill || '-')+'</div>'
        + '<div class="tk-skill-detail">'+tkColorizeMujin(g.skillDetail || g.effect || '')+'</div>'
        + (g.mujinNote ? '<div class="tk-skill-detail" style="margin-top:6px;color:var(--muted);">'+tkColorizeMujin(g.mujinNote)+'</div>' : '')
        + (g.categoryLinks && g.categoryLinks.length ? g.categoryLinks.map(function(c){
            return '<div class="tk-skill-detail" style="margin-top:8px;"><a href="'+c.href+'">→ '+tkEscapeHtml(c.label)+'</a></div>';
          }).join('') : '')
      + '</div>'
      + (g.trTable ? (
        '<div class="tk-detail-block"><h2>鍛錬レベル別性能</h2>'
        + '<div class="tk-table-scroll"><table class="tk-stat-table"><thead><tr><th>レベル</th><th class="tk-col-narrow">必要ポイント</th><th>効果</th></tr></thead><tbody>'
        + tkVisibleTrRows(g.trTable).map(function(row){ return '<tr><td>'+tkEscapeHtml(row.level)+'</td><td class="tk-col-narrow">'+tkEscapeHtml(row.points||'-')+'</td><td style="text-align:left;">'+(row.effect ? tkColorizeMujin(row.effect) : '<span style="color:var(--muted);">未確認</span>')+'</td></tr>'; }).join('')
        + '</tbody></table></div></div>'
      ) : '')
      + (g.synthesisTable ? (
        '<div class="tk-detail-block"><h2>合成素材にした場合の候補スキル</h2>'
        + '<div class="tk-table-scroll"><table class="tk-stat-table"><thead><tr><th>候補</th><th>初期スキル</th><th>移植後合成候補</th></tr></thead><tbody>'
        + g.synthesisTable.map(function(row){
            // 移植前(skill)と移植後(afterSkill)は別スキルのことがあり、性能も異なる。
            // target/rate/effectShort は移植前の性能、after* は移植後の性能を表す。
            // after* が未指定の場合は移植前の値をそのまま流用する(自己参照の行では同じ値になるため)。
            const buildDesc = function(t, r, e){
              const tl = t ? '対象:'+tkColorizeMujin(t)+' ' : '';
              const rl = r ? '確率'+tkEscapeHtml(r)+' ' : '';
              return (t || r || e) ? '<div class="tk-synth-desc">'+tl+rl+tkColorizeMujin(e||'')+'</div>' : '';
            };
            const desc = buildDesc(row.target, row.rate, row.effectShort);
            const hasAfterOwn = (row.afterTarget || row.afterRate || row.afterEffectShort);
            // 移植後が別スキルなのに専用の性能が未登録の場合、移植前の数値を流用すると誤情報になるため何も出さない
            const afterDesc = hasAfterOwn
              ? buildDesc(row.afterTarget || row.target, row.afterRate || row.rate, row.afterEffectShort || row.effectShort)
              : (row.afterSkill === row.skill ? desc : '');
            const skillLabel = '<div class="tk-synth-cell"><span class="tk-synth-name">'+tkSkillLink(row.skill, row.rank)+'</span>'+desc+'</div>';
            const afterLabel = row.afterSkill ? ('<div class="tk-synth-cell"><span class="tk-synth-name">'+tkSkillLink(row.afterSkill, row.afterRank)+'</span>'+afterDesc+'</div>') : '-';
            return '<tr><td>'+tkEscapeHtml(row.slot)+'</td><td>'+skillLabel+'</td>'
              + '<td>'+afterLabel+'</td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + (g.synthesisNote ? '<p class="tk-detail-meta" style="margin-top:6px;">'+tkEscapeHtml(g.synthesisNote)+'</p>' : '')
        + '</div>'
      ) : '')
      // 関連記事。articles を持つ武将だけに出る汎用フィールドで、
      // 見た目は記事一覧(blog.html)と同じ .article-card 系(site.css)をそのまま使う。
      + (g.articles && g.articles.length ? (
        '<div class="tk-detail-block"><h2>この武将を扱った記事</h2>'
        + '<ul class="article-list">'
        + g.articles.map(function(a){
            return '<li class="article-card"><a class="article-card-link" href="'+tkEscapeHtml(a.href)+'">'
              + '<div class="article-card-body">'
                + '<h2>'+tkEscapeHtml(a.title)+'</h2>'
                + (a.date ? '<div class="article-card-date">'+tkEscapeHtml(a.date)+'</div>' : '')
                + (a.excerpt ? '<p class="article-card-excerpt">'+tkEscapeHtml(a.excerpt)+'</p>' : '')
              + '</div>'
              + (a.thumb ? '<div class="article-card-thumb"><img src="'+tkEscapeHtml(a.thumb)+'" alt="" loading="lazy" decoding="async"></div>' : '')
              + '</a></li>';
          }).join('')
        + '</ul></div>'
      ) : '')
      + (g.illustrator ? '<p class="tk-illust-credit">Illust. '+tkEscapeHtml(g.illustrator)+'</p>' : '');
  }

  // ============ 表示切り替え(URLハッシュに応じて一覧/詳細を出し分け) ============
  // 2026-08-14: 詳細は busho/{No}.html に完全に分けた。このページは一覧だけを出す。
  // 古い #No で来た人は、ページ末尾の転送スクリプトが個別ページへ送る。
  //
  // **tkRenderDetail は消さないこと。** busho/{No}.html の中身は
  // tools/gen_detail_pages.py がこの関数を実機で動かして作っている。
  function tkRoute(){
    document.getElementById('listView').style.display = '';
    document.getElementById('detailView').style.display = 'none';
  }

  tkRenderList(tkSortByChapterThenNo(tokuGenerals));
  tkRoute();
</script>
  </div>
</div>

<script src="assets/js/site-sidebar.js">
</script>
<script>
  // 一覧の行にカーソルを置いたら TYPE2 の切り抜きを出す(2026-08-13、ユーザー依頼)。
  // 文字だけではどの武将か思い出せない、という話への対応。
  // 元画像は 224x315。その7割(157px幅)で出す。高さは比率のまま。
  (function(){
    // 触る画面では最初から何もしない。CSSでも display:none にしてあるが、
    // 「1回目のタップがホバー扱いになって、リンクを開くのに2回要る」という
    // 端末があるので、listener自体を付けないことで確実に避ける。
    try {
      if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
    } catch (e) {}
    var pop = null, img = null;
    function ensure(){
      if (pop) return;
      pop = document.createElement('div');
      pop.className = 'cardhover-pop';
      img = document.createElement('img');
      img.alt = '';
      pop.appendChild(img);
      document.body.appendChild(pop);
    }
    function place(ev){
      if (!pop || pop.style.display === 'none') return;
      var w = pop.offsetWidth || 165, h = pop.offsetHeight || 230, pad = 16;
      var x = ev.clientX + pad, y = ev.clientY + pad;
      if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
      if (y < 8) y = 8;
      pop.style.left = x + 'px';
      pop.style.top = y + 'px';
    }
    document.addEventListener('mouseover', function(ev){
      var t = ev.target && ev.target.closest ? ev.target.closest('tr[data-thumb]') : null;
      if (!t) return;
      ensure();
      var src = t.getAttribute('data-thumb');
      if (img.getAttribute('src') !== src) img.setAttribute('src', src);
      pop.style.display = 'block';
      place(ev);
    });
    document.addEventListener('mousemove', place);
    document.addEventListener('mouseout', function(ev){
      if (!pop) return;
      var t = ev.target && ev.target.closest ? ev.target.closest('tr[data-thumb]') : null;
      var to = ev.relatedTarget && ev.relatedTarget.closest
        ? ev.relatedTarget.closest('tr[data-thumb]') : null;
      if (t && t !== to) pop.style.display = 'none';
    });
    // 画面が動いたら消す(位置がずれたまま残るのを防ぐ)
    window.addEventListener('scroll', function(){ if (pop) pop.style.display = 'none'; }, true);
  })();
</script>

<script>
  // 古い #No / #スキル名 形式で来た人を、個別URLへ送る(2026-08-14)。
  // 一覧からは個別ページへ直接飛ぶようになり、このページに詳細パネルは無い。
  // 転送しておかないと、外に出回っている古いリンクが「一覧が開くだけ」になる。
  (function(){
    function go(){
      var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!h) return;
      var name = h.replace(/[^0-9]/g, '');
      if (!name) return;
      location.replace('busho/' + name + '.html');
    }
    go();
    window.addEventListener('hashchange', go);
  })();
</script>
